<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 상품페이지 미리보기 툴</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./favicon.png">
<style>
  :root{
    /* coupang-* 는 실제 쿠팡 화면 미리보기 정확도를 위해 그대로 유지하고,
       도구 자체의 UI 톤만 소싱 매니페스트와 통일된 색감으로 맞춘다. */
    --coupang-blue:#00379d;
    --coupang-price:#e2231a;
    --coupang-green:#3bb54a;
    --bg-app:#f6f3ec;
    --panel-bg:#fffdf8;
    --border:#dcd5c3;
    --text-1:#1b2a3d;
    --text-2:#5f6b78;
    --text-3:#8b95a1;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    width:100%;
    overflow-x:hidden;
    overscroll-behavior-x:none;
  }
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg-app);
    color:var(--text-1);
  }
  .app{
    display:grid;
    grid-template-columns: 380px 1fr;
    min-height:100vh;
  }
  /* ---------------- LEFT CONTROL PANEL ---------------- */
  .panel{
    background:var(--panel-bg);
    border-right:1px solid var(--border);
    padding:24px 20px 60px;
    overflow-y:auto;
    height:100vh;
    position:sticky;
    top:0;
  }
  .panel h1{font-size:17px;margin:0 0 4px;letter-spacing:-0.3px;}
  .panel .sub{font-size:12px;color:var(--text-3);margin:0 0 20px;line-height:1.5;}
  .section{margin-bottom:22px;padding-bottom:22px;border-bottom:1px dashed var(--border);}
  .section:last-child{border-bottom:none;}
  .section-label{font-size:12px;font-weight:700;color:var(--coupang-blue);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11.5px;color:var(--text-2);margin-bottom:4px;}
  .field input[type=text], .field input[type=number]{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .upload-btn{
    display:block;width:100%;padding:10px;text-align:center;background:#f6f7f9;
    border:1px dashed #c7ccd4;border-radius:8px;font-size:12.5px;color:var(--text-2);cursor:pointer;transition:.15s;
  }
  .upload-btn:hover{background:#eef1f5;border-color:var(--coupang-blue);color:var(--coupang-blue);}
  input[type=file]{display:none;}
  .thumb-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .thumb-item{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--border);}
  .thumb-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb-item .del{
    position:absolute;top:0;right:0;background:rgba(0,0,0,.6);color:#fff;
    width:18px;height:18px;font-size:11px;line-height:18px;text-align:center;cursor:pointer;border-bottom-left-radius:6px;
  }
  .thumb-item .cover-badge{
    position:absolute;bottom:0;left:0;right:0;background:rgba(0,55,157,.85);color:#fff;font-size:9px;text-align:center;padding:1px 0;
  }
  .detail-list{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .detail-item{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:6px;}
  .detail-item img{width:44px;height:44px;object-fit:cover;border-radius:4px;flex-shrink:0;}
  .detail-item .name{flex:1;font-size:11.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-btn{
    width:22px;height:22px;border:1px solid var(--border);background:#fff;border-radius:5px;font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--text-2);
  }
  .icon-btn:hover{background:#f2f2f2;}
  .icon-btn.danger:hover{background:#fdeceb;color:var(--coupang-price);border-color:var(--coupang-price);}
  .empty-hint{font-size:11.5px;color:var(--text-3);text-align:center;padding:10px 0 2px;}
  .device-toggle{display:flex;gap:8px;margin-top:8px;}
  .device-toggle button{
    flex:1;padding:10px 0;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;
  }
  .device-toggle button.active{border-color:var(--coupang-blue);background:var(--coupang-blue);color:#fff;}
  .run-btn{
    width:100%;margin-top:10px;padding:13px 0;border-radius:9px;border:none;
    background:linear-gradient(135deg,#0047c9,#00379d);color:#fff;font-size:14px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 6px 16px rgba(0,55,157,.28);
  }
  .run-btn:hover{filter:brightness(1.06);}
  .footer-note{font-size:10.5px;color:var(--text-3);line-height:1.6;margin-top:8px;}

  /* ---------------- RIGHT PREVIEW AREA ---------------- */
  .preview-area{padding:32px;display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden;}
  .stage-label{text-align:center;font-size:12px;color:var(--text-3);margin-bottom:10px;}

  /* ===== Mobile frame (in-panel preview) ===== */
  .phone-frame{width:390px;background:#0c0c0c;border-radius:44px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .phone-screen{background:#fff;border-radius:32px;overflow:hidden;position:relative;height:780px;display:flex;flex-direction:column;}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0c0c0c;border-bottom-left-radius:16px;border-bottom-right-radius:16px;z-index:20;}
  .m-scroll{
    flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    touch-action:pan-y;overscroll-behavior:contain;
  }
  .m-scroll::-webkit-scrollbar{width:0;}

  /* ---- shared mobile content styles (used in-panel & fullscreen) ---- */
  .m-gallery{
    position:relative;width:100%;aspect-ratio:1/1;background:#f4f4f4;display:flex;align-items:center;
    overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    touch-action:pan-x;overscroll-behavior-x:contain;
  }
  .m-gallery.no-swipe{overflow-x:hidden;touch-action:auto;}
  .m-gallery::-webkit-scrollbar{display:none;}
  .m-gallery img{width:100%;height:100%;object-fit:cover;flex-shrink:0;scroll-snap-align:start;}
  .m-gallery .ph{
    width:100%;height:100%;flex-shrink:0;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;
    color:#c3c6cc;font-size:12px;background:repeating-linear-gradient(45deg,#f7f7f8,#f7f7f8 10px,#efeff1 10px,#efeff1 20px);
  }
  .m-gallery-back{
    position:absolute;top:14px;left:14px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#222;box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .m-gallery-heart{
    position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .m-gallery-detailpill{
    position:absolute;top:52%;right:14px;transform:translateY(-50%);background:rgba(255,255,255,.92);border-radius:14px;padding:6px 11px;
    font-size:11px;font-weight:600;color:#333;box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .m-dots{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;
    background:rgba(0,0,0,.28);padding:4px 9px;border-radius:10px;
  }
  .m-dots span{width:4.5px;height:4.5px;border-radius:50%;background:rgba(255,255,255,.55);}
  .m-dots span:first-child{background:#fff;}
  .m-dots .list-ic{color:#fff;font-size:10px;margin-left:3px;}
  .m-body{padding:16px 14px 0;}
  .m-social{display:flex;align-items:center;gap:6px;font-size:12px;color:#4a4a4a;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid #f2f2f2;}
  .m-social .bag{color:#c98a4b;font-size:14px;}
  .m-social .ic{margin-left:auto;display:flex;gap:16px;font-size:15px;color:#8a8a8a;}
  .m-rating-row{text-align:right;font-size:12.5px;color:#555;margin-bottom:10px;}
  .m-rating-row .star{color:#ffb100;letter-spacing:1px;}
  .m-title{font-size:16px;font-weight:700;line-height:1.42;color:#111;margin-bottom:8px;}
  .m-rank{font-size:12.5px;color:#666;margin-bottom:6px;}
  .m-rank b{color:#ff5a1f;font-weight:700;}
  .m-option{font-size:12px;color:#8a8a8a;margin-bottom:16px;}
  .m-price-box{border-top:1px solid #f0f0f0;padding-top:16px;margin-top:2px;}
  .m-price-row{display:flex;align-items:center;gap:7px;margin-bottom:2px;flex-wrap:wrap;}
  .m-discount-badge{
    background:var(--coupang-price);color:#fff;font-weight:800;font-size:15.5px;
    padding:2px 6px;border-radius:4px;line-height:1.3;
  }
  .m-price{font-size:23px;font-weight:800;color:#111;letter-spacing:-0.3px;}
  .m-per{font-size:11.5px;color:#9a9a9a;}
  .m-original{font-size:12px;color:#b0b0b0;text-decoration:line-through;}
  .m-info-ic{
    display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;
    border:1px solid #c9c9c9;color:#9a9a9a;font-size:9.5px;font-style:normal;
  }
  .m-coupon{font-size:12.5px;color:var(--coupang-price);margin:8px 0 14px;display:flex;align-items:center;gap:3px;}
  .m-coupon .chev{color:#c9a5a2;margin-left:2px;}
  .m-shiprow{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#222;margin-bottom:9px;flex-wrap:wrap;}
  .m-shiprow b{font-weight:700;}
  .m-shiprow .dawn-pill{
    border:1px solid var(--coupang-green);color:var(--coupang-green);font-size:10.5px;font-weight:700;
    padding:1.5px 6px;border-radius:9px;
  }
  .m-freerow{display:flex;align-items:center;gap:14px;font-size:11.5px;color:#8a8a8a;padding-bottom:18px;}
  .m-freerow span{display:flex;align-items:center;gap:4px;}
  .m-notice{
    margin:0 -14px;padding:22px 24px;background:#fafafa;border-top:8px solid #f4f5f7;text-align:center;
  }
  .m-notice .tag{color:var(--coupang-price);font-weight:800;font-size:13px;margin-bottom:12px;}
  .m-notice .quote{font-size:13.5px;line-height:1.9;color:#222;}
  .m-notice .quote b{font-weight:800;}
  .m-notice .hi{color:var(--coupang-blue);font-weight:700;}
  .m-seller-box{margin:0 -14px;padding:16px 14px;border-top:8px solid #f4f5f7;font-size:12.5px;color:#333;}
  .m-seller-box .line1{margin-bottom:14px;line-height:1.6;}
  .m-seller-box .line1 b{font-weight:700;}
  .m-cash-row{display:flex;align-items:center;font-size:12.5px;color:#333;padding:12px 0;border-top:1px solid #f2f2f2;}
  .m-cash-row .chev{margin-left:auto;color:#c9c9c9;}
  .m-wow-title{display:flex;align-items:center;font-size:13.5px;font-weight:700;color:#111;padding-top:14px;}
  .m-wow-title span{margin-left:auto;font-size:11.5px;font-weight:400;color:#999;}
  .m-wow{display:flex;gap:8px;margin-top:12px;overflow-x:auto;}
  .m-wow::-webkit-scrollbar{display:none;}
  .m-wow div{flex:0 0 auto;min-width:104px;background:#eef4ff;border-radius:10px;padding:12px 10px;text-align:center;}
  .m-wow div b{display:block;font-size:16px;color:var(--coupang-blue);margin-bottom:2px;}
  .m-wow div span{font-size:10px;color:#5a6b8c;line-height:1.4;}
  .m-sellerinfo-row{display:flex;align-items:center;font-size:12.5px;color:#333;padding:13px 0;border-top:1px solid #f2f2f2;}
  .m-sellerinfo-row .store-ic{margin-right:6px;}
  .m-sellerinfo-row .chev{margin-left:auto;color:#c9c9c9;font-size:11.5px;}
  .m-allsellers-row{display:flex;align-items:center;font-size:12.5px;color:#333;padding:14px 0;border-top:8px solid #f4f5f7;margin:0 -14px;padding-left:14px;padding-right:14px;}
  .m-allsellers-row b{color:var(--coupang-price);}
  .m-allsellers-row .chev{margin-left:auto;color:#c9c9c9;}
  .m-infoblock{margin:0 -14px;padding:16px 14px 4px;border-top:8px solid #f4f5f7;}
  .m-infoblock .h{font-size:14px;font-weight:700;margin-bottom:10px;}
  .m-infoblock .row{display:flex;justify-content:space-between;font-size:12.5px;color:#444;padding:9px 0;border-bottom:1px solid #f4f4f4;}
  .m-infoblock .row span:first-child{color:#999;}
  .m-infoblock .link{font-size:12px;color:#999;text-align:center;padding:12px 0;}
  .m-section-title{
    font-size:14.5px;font-weight:700;margin:0;padding:20px 14px 12px;border-top:8px solid #f4f5f7;
    margin-left:-14px;margin-right:-14px;
  }
  .m-detail-imgs img{width:100%;display:block;}
  .m-buybar{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #eee;background:#fff;}
  .m-buybar button{flex:1;padding:13px 0;border-radius:8px;border:none;font-size:14px;font-weight:700;cursor:pointer;}
  .m-buybar .cart{background:#fff;border:1.5px solid var(--coupang-blue);color:var(--coupang-blue);}
  .m-buybar .buy{background:var(--coupang-blue);color:#fff;}
  .m-tabbar{display:flex;border-top:1px solid #f0f0f0;background:#fff;padding:9px 0 12px;}
  .m-tabbar div{flex:1;text-align:center;font-size:19px;color:#c7c7c7;}
  .m-tabbar div.on{color:#222;}
  .m-empty{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#c7c9cf;font-size:12.5px;height:100%;gap:8px;padding:40px 20px;text-align:center;}

  /* ===== PC frame ===== */
  .pc-frame{width:min(94vw, 1180px);background:#dfe1e6;border-radius:12px 12px 0 0;padding:10px 10px 0;box-shadow:0 20px 60px rgba(0,0,0,.18);}
  .pc-chrome{display:flex;align-items:center;gap:6px;padding:6px 8px 10px;}
  .pc-chrome .dot{width:10px;height:10px;border-radius:50%;}
  .pc-chrome .dot.r{background:#ff5f57;} .pc-chrome .dot.y{background:#febc2e;} .pc-chrome .dot.g{background:#28c840;}
  .pc-addr{flex:1;margin-left:10px;background:#fff;border-radius:14px;font-size:11.5px;color:#888;padding:5px 14px;}
  .pc-screen{background:#fff;height:800px;overflow-y:auto;border-radius:2px;}
  .pc-screen::-webkit-scrollbar{width:10px;}
  .pc-screen::-webkit-scrollbar-thumb{background:#d5d7db;border-radius:6px;}
  .pc-header{border-bottom:1px solid #eee;padding:14px 40px;display:flex;align-items:center;gap:24px;}
  .pc-logo{font-size:26px;font-weight:800;color:var(--coupang-blue);letter-spacing:-1px;}
  .pc-search{flex:1;max-width:640px;display:flex;border:2px solid var(--coupang-blue);border-radius:22px;overflow:hidden;}
  .pc-search input{border:none;flex:1;padding:9px 16px;font-size:13px;outline:none;}
  .pc-search button{border:none;background:var(--coupang-blue);color:#fff;padding:0 20px;cursor:pointer;font-size:13px;}
  .pc-header-icons{display:flex;gap:18px;font-size:11.5px;color:#333;align-items:center;}
  .pc-catbar{display:flex;gap:22px;padding:10px 40px;font-size:12.5px;color:#444;border-bottom:1px solid #f0f0f0;}
  .pc-crumb{padding:10px 40px 0;font-size:11.5px;color:#999;}
  .pc-main{display:flex;gap:40px;padding:16px 40px 30px;}
  .pc-gallery{width:420px;flex-shrink:0;}
  .pc-gallery-thumbs{display:flex;flex-direction:column;gap:8px;float:left;margin-right:12px;}
  .pc-gallery-thumbs img, .pc-gallery-thumbs .ph-mini{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid #eee;cursor:pointer;}
  .pc-gallery-main{margin-left:68px;width:352px;height:352px;border-radius:8px;overflow:hidden;background:#f7f7f8;display:flex;align-items:center;justify-content:center;position:relative;}
  .pc-gallery-main img{width:100%;height:100%;object-fit:cover;}
  .pc-gallery-heart{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .pc-buybox{flex:1;min-width:0;}
  .pc-seller{font-size:11.5px;color:#999;margin-bottom:6px;}
  .pc-title{font-size:19px;font-weight:600;line-height:1.5;color:#1a1a1a;margin-bottom:8px;}
  .pc-rank{font-size:12.5px;margin-bottom:8px;} .pc-rank b{color:var(--coupang-price);}
  .pc-rating{font-size:12.5px;color:#777;margin-bottom:8px;}
  .pc-rating .star{color:#ffb100;}
  .pc-option{font-size:12.5px;color:#666;background:#f8f9fb;border-radius:8px;padding:10px 12px;margin-bottom:14px;}
  .pc-option b{color:#333;}
  .pc-price-box{border-top:1px solid #eee;padding-top:16px;}
  .pc-discount{color:var(--coupang-price);font-weight:800;font-size:24px;margin-right:8px;}
  .pc-price{font-size:28px;font-weight:800;color:#1a1a1a;}
  .pc-per{font-size:12px;color:#999;margin-left:6px;}
  .pc-original{font-size:13px;color:#b5b5b5;text-decoration:line-through;margin:4px 0 6px;}
  .pc-coupon{font-size:12.5px;color:var(--coupang-price);margin-bottom:14px;}
  .pc-badges{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .pc-badge{font-size:11.5px;padding:5px 10px;border-radius:5px;font-weight:600;}
  .pc-badge.rocket{background:#e9f1ff;color:var(--coupang-blue);}
  .pc-badge.free{background:#eaf8ec;color:var(--coupang-green);}
  .pc-deliver{background:#f8f9fb;border-radius:10px;padding:14px 16px;font-size:12.5px;color:#555;margin-bottom:18px;line-height:1.8;}
  .pc-deliver b{color:#1a1a1a;}
  .pc-qty{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:12.5px;color:#555;}
  .pc-qty .stepper{display:flex;align-items:center;border:1px solid #ddd;border-radius:6px;}
  .pc-qty .stepper span{width:30px;text-align:center;font-size:13px;padding:6px 0;}
  .pc-qty .stepper button{width:26px;background:#f7f7f7;border:none;cursor:pointer;padding:6px 0;}
  .pc-buttons{display:flex;gap:10px;}
  .pc-buttons button{flex:1;padding:15px 0;border-radius:6px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;}
  .pc-buttons .cart{background:#fff;border:1.5px solid var(--coupang-blue);color:var(--coupang-blue);}
  .pc-buttons .buy{background:var(--coupang-blue);color:#fff;}
  .pc-section-title{font-size:17px;font-weight:700;padding:26px 40px 14px;border-top:10px solid #f4f5f7;margin-top:10px;}
  .pc-notice{margin:0 40px 10px;border:1px solid #eee;border-radius:8px;overflow:hidden;font-size:12px;}
  .pc-notice table{width:100%;border-collapse:collapse;}
  .pc-notice td{padding:9px 14px;border-bottom:1px solid #f2f2f2;color:#555;}
  .pc-notice td.k{width:130px;background:#fafafb;color:#888;}
  .pc-seller-box{margin:0 40px 10px;background:#fafbfc;border-radius:10px;padding:16px 18px;font-size:12.5px;color:#555;line-height:1.9;}
  .pc-seller-box b{color:#1a1a1a;}
  .pc-detail-imgs{padding:0 40px 40px;text-align:center;}
  .pc-detail-imgs img{max-width:780px;width:100%;display:block;margin:0 auto;}
  .pc-empty{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#c7c9cf;font-size:13px;height:100%;gap:10px;}
  .ph-mini{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#f7f7f8,#f7f7f8 8px,#efeff1 8px,#efeff1 16px);color:#c3c6cc;font-size:9px;}

  /* ===== Fullscreen run mode ===== */
  #fs-overlay{
    position:fixed;inset:0;background:#e8eaee;z-index:9999;display:none;
    align-items:stretch;justify-content:center;
  }
  #fs-overlay.open{display:flex;}
  .fs-close{
    position:fixed;top:16px;right:16px;z-index:10001;width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;border:none;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .fs-close:hover{background:rgba(0,0,0,.75);}
  .fs-mobile-wrap{
    width:100%;max-width:480px;margin:0 auto;height:100vh;background:#fff;
    display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.15);
    overflow-x:hidden;
  }
  .fs-mobile-wrap .m-scroll{flex:1;overflow-y:auto;overflow-x:hidden;}
  .fs-pc-wrap{width:100%;height:100vh;background:#fff;overflow-y:auto;}
  .fs-pc-wrap::-webkit-scrollbar{width:12px;}
  .fs-pc-wrap::-webkit-scrollbar-thumb{background:#d5d7db;border-radius:6px;}

  @media (max-width: 900px){
    .app{grid-template-columns:1fr;}
    .panel{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--border);}
    .preview-area{padding:20px 10px;}
    .phone-frame{transform:scale(0.92);transform-origin:top center;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===================== LEFT PANEL ===================== -->
  <div class="panel">
    <h1>🛒 쿠팡 상품페이지 미리보기</h1>
    <p class="sub">썸네일과 상세페이지 이미지를 넣으면 실제 쿠팡 화면처럼 스크롤로 확인할 수 있어요.</p>

    <div class="section">
      <div class="section-label">📱 미리보기 화면</div>
      <div class="device-toggle">
        <button id="btn-mobile" class="active" onclick="setDevice('mobile')">모바일</button>
        <button id="btn-pc" onclick="setDevice('pc')">PC</button>
      </div>
      <button class="run-btn" onclick="openFullscreen()">▶ 실행 — 전체화면으로 보기</button>
    </div>

    <div class="section">
      <div class="section-label">상품 기본 정보</div>
      <div class="field"><label>스토어명</label>
        <input type="text" id="in-store" value="MORIVA" oninput="render()"></div>
      <div class="field"><label>판매자 상호(정식명)</label>
        <input type="text" id="in-sellerlegal" value="주식회사 모리바(MORIVA)" oninput="render()"></div>
      <div class="field"><label>상품명</label>
        <input type="text" id="in-title" value="[MORIVA] 프리미엄 접이식 캠핑 테이블 대형 알루미늄 야외 휴대용 초경량" oninput="render()"></div>
      <div class="field"><label>카테고리 랭킹 문구</label>
        <input type="text" id="in-rank" value="캠핑용품 구매 1위" oninput="render()"></div>
      <div class="field"><label>옵션 문구 (예: 색상 x 사이즈 x 수량)</label>
        <input type="text" id="in-option" value="색상 x 사이즈 x 수량  블랙 x 대형 x 1개" oninput="render()"></div>
      <div class="row2">
        <div class="field"><label>할인율(%)</label><input type="number" id="in-discount" value="17" oninput="render()"></div>
        <div class="field"><label>판매가(원)</label><input type="number" id="in-price" value="27800" oninput="render()"></div>
      </div>
      <div class="field"><label>정가(원, 취소선)</label>
        <input type="number" id="in-original" value="33500" oninput="render()"></div>
      <div class="field"><label>쿠폰할인 문구</label>
        <input type="text" id="in-coupon" value="2,000원 쿠폰할인 · 11시간 남음" oninput="render()"></div>
      <div class="row2">
        <div class="field"><label>평점</label><input type="number" id="in-rating" value="4.5" step="0.1" oninput="render()"></div>
        <div class="field"><label>리뷰수</label><input type="number" id="in-reviews" value="2648" oninput="render()"></div>
      </div>
      <div class="field"><label>배송 도착 문구</label>
        <input type="text" id="in-deliver" value="내일(7/17) 새벽 7시 전 도착" oninput="render()"></div>
      <div class="field"><label>구매 사회적증거 문구</label>
        <input type="text" id="in-social" value="한 달간 3,200명 이상 구매했어요" oninput="render()"></div>
      <div class="field"><label>주의사항 안내문구 (선택, 비우면 표시 안 함)</label>
        <input type="text" id="in-notice" value="" placeholder="예: 저가 제품과 다르게 저희가 직접 제작했습니다" oninput="render()"></div>
    </div>

    <div class="section">
      <div class="section-label">🖼️ 썸네일 이미지 (대표/서브)</div>
      <label class="upload-btn">+ 썸네일 이미지 추가 (여러 장 선택 가능)
        <input type="file" accept="image/*" multiple onchange="handleThumbUpload(event)"></label>
      <div class="thumb-list" id="thumb-list"></div>
      <div class="empty-hint" id="thumb-empty">아직 등록된 썸네일이 없어요</div>
    </div>

    <div class="section">
      <div class="section-label">📄 상세페이지 이미지</div>
      <label class="upload-btn">+ 상세페이지 이미지 추가 (여러 장 선택 가능)
        <input type="file" accept="image/*" multiple onchange="handleDetailUpload(event)"></label>
      <div class="detail-list" id="detail-list"></div>
      <div class="empty-hint" id="detail-empty">아직 등록된 상세페이지 이미지가 없어요</div>
    </div>

    <p class="footer-note">
      * 업로드한 이미지는 서버로 전송되지 않고 브라우저 안에서만 미리보기로 사용됩니다.<br>
      * 실제 쿠팡 화면과 100% 동일하지 않은 목업(mock-up) 화면입니다.<br>
      * "실행" 버튼을 누르면 좌측 패널 없이 화면 전체로 상품페이지를 확인할 수 있어요.
    </p>
  </div>

  <!-- ===================== RIGHT PREVIEW ===================== -->
  <div class="preview-area">
    <div id="preview-wrap"></div>
  </div>

</div>

<!-- ===================== FULLSCREEN RUN OVERLAY ===================== -->
<div id="fs-overlay">
  <button class="fs-close" onclick="closeFullscreen()">✕</button>
  <div id="fs-content" style="width:100%;"></div>
</div>

<script>
let state = { device: 'mobile', thumbs: [], details: [], prodNo: (8000000000 + Math.floor(Math.random()*999999999)) + ' - ' + (10000000 + Math.floor(Math.random()*89999999)) };
let uid = 1;

function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function handleThumbUpload(e){
  const files = Array.from(e.target.files);
  for(const f of files){ const src = await fileToDataURL(f); state.thumbs.push({id:uid++, src}); }
  e.target.value=''; renderControls(); render();
}
async function handleDetailUpload(e){
  const files = Array.from(e.target.files);
  for(const f of files){ const src = await fileToDataURL(f); state.details.push({id:uid++, src, name:f.name}); }
  e.target.value=''; renderControls(); render();
}
function removeThumb(id){ state.thumbs = state.thumbs.filter(t=>t.id!==id); renderControls(); render(); }
function removeDetail(id){ state.details = state.details.filter(t=>t.id!==id); renderControls(); render(); }
function moveDetail(id, dir){
  const idx = state.details.findIndex(t=>t.id===id);
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=state.details.length) return;
  const arr = state.details;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  renderControls(); render();
}
function moveThumbFirst(id){
  const idx = state.thumbs.findIndex(t=>t.id===id);
  if(idx<=0) return;
  const [item] = state.thumbs.splice(idx,1);
  state.thumbs.unshift(item);
  renderControls(); render();
}

function renderControls(){
  const tList = document.getElementById('thumb-list');
  const tEmpty = document.getElementById('thumb-empty');
  tList.innerHTML = '';
  tEmpty.style.display = state.thumbs.length ? 'none' : 'block';
  state.thumbs.forEach((t,i)=>{
    const div = document.createElement('div');
    div.className = 'thumb-item';
    div.innerHTML = `
      <img src="${t.src}" onclick="moveThumbFirst(${t.id})" title="클릭하면 대표이미지로 설정">
      <div class="del" onclick="removeThumb(${t.id})">✕</div>
      ${i===0 ? '<div class="cover-badge">대표</div>' : ''}`;
    tList.appendChild(div);
  });
  const dList = document.getElementById('detail-list');
  const dEmpty = document.getElementById('detail-empty');
  dList.innerHTML = '';
  dEmpty.style.display = state.details.length ? 'none' : 'block';
  state.details.forEach((d,i)=>{
    const div = document.createElement('div');
    div.className = 'detail-item';
    div.innerHTML = `
      <img src="${d.src}">
      <div class="name">${i+1}. ${d.name}</div>
      <div class="icon-btn" onclick="moveDetail(${d.id}, -1)">▲</div>
      <div class="icon-btn" onclick="moveDetail(${d.id}, 1)">▼</div>
      <div class="icon-btn danger" onclick="removeDetail(${d.id})">✕</div>`;
    dList.appendChild(div);
  });
}

function setDevice(dev){
  state.device = dev;
  document.getElementById('btn-mobile').classList.toggle('active', dev==='mobile');
  document.getElementById('btn-pc').classList.toggle('active', dev==='pc');
  render();
  if(document.getElementById('fs-overlay').classList.contains('open')) renderFullscreen();
}

function fmt(n){ n = Number(n)||0; return n.toLocaleString('ko-KR'); }

function getVals(){
  return {
    store: document.getElementById('in-store').value || 'STORE',
    sellerLegal: document.getElementById('in-sellerlegal').value || '',
    title: document.getElementById('in-title').value || '상품명을 입력해주세요',
    rank: document.getElementById('in-rank').value || '',
    option: document.getElementById('in-option').value || '',
    discount: document.getElementById('in-discount').value || 0,
    price: document.getElementById('in-price').value || 0,
    original: document.getElementById('in-original').value || 0,
    coupon: document.getElementById('in-coupon').value || '',
    rating: document.getElementById('in-rating').value || 0,
    reviews: document.getElementById('in-reviews').value || 0,
    deliver: document.getElementById('in-deliver').value || '',
    social: document.getElementById('in-social').value || '',
    notice: document.getElementById('in-notice') ? document.getElementById('in-notice').value : ''
  };
}

function starRow(rating){
  const full = Math.round(rating);
  let s = '';
  for(let i=0;i<5;i++) s += i<full ? '★' : '☆';
  return s;
}

/* ---------- MOBILE CONTENT (shared) ---------- */
function mobileInnerHTML(v){
  const gallery = state.thumbs.length
    ? state.thumbs.map(t=>`<img src="${t.src}">`).join('')
    : `<div class="ph">등록된 썸네일 이미지가<br>여기에 표시됩니다</div>`;
  const dots = state.thumbs.length
    ? state.thumbs.map((_,i)=>`<span></span>`).join('') : `<span></span>`;
  const gallerySwipeClass = state.thumbs.length > 1 ? '' : ' no-swipe';

  const details = state.details.length
    ? `<div class="m-section-title">상품 상세정보</div>
       <div class="m-detail-imgs">${state.details.map(d=>`<img src="${d.src}">`).join('')}</div>`
    : `<div class="m-section-title">상품 상세정보</div>
       <div class="m-empty" style="height:200px;">등록된 상세페이지 이미지가<br>여기에 표시됩니다</div>`;

  const noticeBlock = v.notice ? `
        <div class="m-notice">
          <div class="tag">※ 주의사항 ※</div>
          <div class="quote">「 ${v.notice} 」</div>
        </div>` : '';

  return `
    <div class="m-scroll">
      <div class="m-gallery${gallerySwipeClass}">
        ${gallery}
        <div class="m-gallery-back">‹</div>
        <div class="m-gallery-heart">♡</div>
        <div class="m-gallery-detailpill">상품상세 ›</div>
        <div class="m-dots">${dots}<span class="list-ic">☰</span></div>
      </div>
      <div class="m-body">
        <div class="m-social"><span class="bag">🛍️</span> ${v.social} <span class="ic">🎁 ⇪</span></div>
        <div class="m-rating-row"><span class="star">${starRow(v.rating)}</span> (${fmt(v.reviews)})</div>
        <div class="m-title">${v.title}</div>
        ${v.rank ? `<div class="m-rank"><b>${v.rank}</b> ›</div>` : ''}
        ${v.option ? `<div class="m-option">${v.option}</div>` : ''}
        <div class="m-price-box">
          <div class="m-price-row">
            <span class="m-discount-badge">${v.discount}%</span>
            <span class="m-price">${fmt(v.price)}원</span>
            <span class="m-per">(1개당 ${fmt(v.price)}원)</span>
          </div>
          <div class="m-price-row" style="margin-top:2px;">
            <span class="m-original">${fmt(v.original)}원</span>
            <i class="m-info-ic">i</i>
          </div>
          ${v.coupon ? `<div class="m-coupon">↓ ${v.coupon}<span class="chev">›</span></div>` : ''}
          <div class="m-shiprow">🚀 <b>판매자로켓</b> <span class="dawn-pill">새벽</span></div>
          <div class="m-shiprow"><b>${v.deliver}</b></div>
          <div class="m-freerow">
            <span>🚚 무료배송</span>
            <span>↩︎ 단순변심도 30일 무료반품</span>
          </div>
        </div>
      </div>
      ${noticeBlock}
      <div class="m-seller-box">
        <div class="line1"><b>쿠팡</b>이 배송하고 <b>${v.sellerLegal}</b>이(가) 판매합니다.</div>
        <div class="m-cash-row">최대 ${fmt(Math.round(v.price*0.05))}원 쿠팡캐시 적립<span class="chev">⌄</span></div>
        <div class="m-wow-title">쿠팡 와우카드<span>더보기 ›</span></div>
        <div class="m-wow">
          <div><b>1.2%</b><span>외식, 주유 등<br>최대 1.2% 캐시적립</span></div>
          <div><b>4%</b><span>쿠팡에선 최대<br>4% 캐시적립</span></div>
        </div>
        <div class="m-sellerinfo-row"><span class="store-ic">🏪</span> 판매자: ${v.sellerLegal} <span class="chev">상품 더보기 ›</span></div>
      </div>
      <div class="m-allsellers-row">이 상품의 모든 판매자 <b>(1)</b> 새 상품 ${fmt(v.price)}원~ (현재상품) <span class="chev">›</span></div>
      <div class="m-infoblock">
        <div class="h">상품정보</div>
        <div class="row"><span>쿠팡상품번호</span><span>${state.prodNo}</span></div>
        <div class="link">필수표기정보 보기 ›</div>
      </div>
      ${details}
    </div>
    <div class="m-buybar">
      <button class="cart">장바구니</button>
      <button class="buy">바로구매</button>
    </div>
    <div class="m-tabbar">
      <div class="on">⌂</div>
      <div>▦</div>
      <div>⌕</div>
      <div>◎</div>
      <div>🛒</div>
    </div>`;
}

/* ---------- PC CONTENT (shared) ---------- */
function pcInnerHTML(v){
  const mainImg = state.thumbs[0]
    ? `<img src="${state.thumbs[0].src}">`
    : `<span style="color:#c3c6cc;font-size:13px;">대표 썸네일이<br>여기에 표시됩니다</span>`;
  const subThumbs = state.thumbs.length
    ? state.thumbs.map(t=>`<img src="${t.src}">`).join('')
    : `<div class="ph-mini" style="width:56px;height:56px;border-radius:6px;">이미지</div>`;
  const details = state.details.length
    ? state.details.map(d=>`<img src="${d.src}">`).join('')
    : `<div class="pc-empty" style="height:260px;">등록된 상세페이지 이미지가 여기에 표시됩니다</div>`;

  return `
    <div class="pc-header">
      <div class="pc-logo">coupang</div>
      <div class="pc-search"><input type="text" value="${v.title.slice(0,20)}" readonly><button>검색</button></div>
      <div class="pc-header-icons"><span>👤 로그인</span><span>🛒 장바구니</span></div>
    </div>
    <div class="pc-catbar">
      <span>로켓배송</span><span>로켓프레시</span><span>패션</span><span>뷰티</span><span>홈리빙</span><span>스포츠/레저</span><span>디지털/가전</span>
    </div>
    <div class="pc-crumb">홈 › 카테고리 › ${v.store}</div>
    <div class="pc-main">
      <div class="pc-gallery">
        <div class="pc-gallery-thumbs">${subThumbs}</div>
        <div class="pc-gallery-main">${mainImg}<div class="pc-gallery-heart">♡</div></div>
      </div>
      <div class="pc-buybox">
        <div class="pc-seller">🏪 ${v.store} <span style="color:#ccc;">›</span></div>
        <div class="pc-title">${v.title}</div>
        ${v.rank ? `<div class="pc-rank"><b>${v.rank}</b> ›</div>` : ''}
        <div class="pc-rating"><span class="star">${starRow(v.rating)}</span> ${v.rating}　리뷰 ${fmt(v.reviews)}개</div>
        ${v.option ? `<div class="pc-option">${v.option}</div>` : ''}
        <div class="pc-price-box">
          <span class="pc-discount">${v.discount}%</span><span class="pc-price">${fmt(v.price)}원</span><span class="pc-per">(1개당 ${fmt(v.price)}원)</span>
          <div class="pc-original">${fmt(v.original)}원</div>
          ${v.coupon ? `<div class="pc-coupon">↓ ${v.coupon} ›</div>` : ''}
          <div class="pc-badges">
            <span class="pc-badge rocket">🚀 판매자로켓</span>
            <span class="pc-badge free">무료배송</span>
          </div>
          <div class="pc-deliver"><b>배송</b> ${v.deliver} · 단순변심 30일 무료반품<br><b>판매자</b> ${v.sellerLegal}</div>
          <div class="pc-qty">
            수량
            <div class="stepper"><button>-</button><span>1</span><button>+</button></div>
            <span style="margin-left:auto;color:#999;">총 상품금액 <b style="color:#1a1a1a;">${fmt(v.price)}원</b></span>
          </div>
          <div class="pc-buttons"><button class="cart">장바구니 담기</button><button class="buy">바로구매</button></div>
        </div>
      </div>
    </div>
    <div class="pc-section-title">판매자 정보</div>
    <div class="pc-seller-box">
      <b>쿠팡</b>이 배송하고 <b>${v.sellerLegal}</b>이(가) 판매합니다.<br>
      최대 ${fmt(Math.round(v.price*0.05))}원 쿠팡캐시 적립 · 판매자 상품 더보기 ›
    </div>
    <div class="pc-section-title">상품정보제공고시</div>
    <div class="pc-notice">
      <table>
        <tr><td class="k">품명 및 모델명</td><td>${v.title.slice(0,30)}</td></tr>
        <tr><td class="k">제조사</td><td>${v.store}</td></tr>
        <tr><td class="k">제조국</td><td>중국(수입)</td></tr>
        <tr><td class="k">A/S 책임자</td><td>${v.store} 고객센터</td></tr>
      </table>
    </div>
    <div class="pc-section-title">상품 상세정보</div>
    <div class="pc-detail-imgs">${details}</div>`;
}

function render(){
  const v = getVals();
  const wrap = document.getElementById('preview-wrap');
  if(state.device === 'mobile'){
    wrap.innerHTML = `
      <div class="stage-label">모바일 (390px) 미리보기 · 스크롤 가능</div>
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="notch"></div>
          ${mobileInnerHTML(v)}
        </div>
      </div>`;
  } else {
    wrap.innerHTML = `
      <div class="stage-label">PC 미리보기 · 스크롤 가능</div>
      <div class="pc-frame">
        <div class="pc-chrome">
          <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
          <div class="pc-addr">🔒 www.coupang.com/vp/products/preview</div>
        </div>
        <div class="pc-screen">${pcInnerHTML(v)}</div>
      </div>`;
  }
}

/* ---------- FULLSCREEN RUN MODE ---------- */
function renderFullscreen(){
  const v = getVals();
  const el = document.getElementById('fs-content');
  if(state.device === 'mobile'){
    el.innerHTML = `<div class="fs-mobile-wrap">${mobileInnerHTML(v)}</div>`;
  } else {
    el.innerHTML = `<div class="fs-pc-wrap">${pcInnerHTML(v)}</div>`;
  }
}
function openFullscreen(){
  renderFullscreen();
  document.getElementById('fs-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeFullscreen(){
  document.getElementById('fs-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeFullscreen(); });

// init
renderControls();
render();
</script>
<script src="./moriva-sync.js"></script>
</body>
</html>
