<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 MORIVA 마진 계산기</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #F6F3EC; overflow-x: hidden; }
    #root { min-height: 100vh; }
    select { -webkit-appearance: none; }
    button { font-family: 'Noto Sans KR', sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #EDE7D8; }
    ::-webkit-scrollbar-thumb { background: #DCD5C3; border-radius: 2px; }

    /* 모바일에서 좌측 입력 패널(370px 고정)이 화면 폭을 넘어가면서
       우측 결과 패널이 화면 밖으로 밀려 보이지 않던 문제 수정.
       820px 이하에서는 좌우 2단을 위아래 1단으로 쌓는다. */
    .mc-main-grid { grid-template-columns: 370px 1fr; }
    @media (max-width: 820px) {
      .mc-main-grid { grid-template-columns: 1fr; }
    }

    /* 좁은 화면에서 페이지 여백/브랜드 헤더 안쪽 여백을 줄이고,
       제목 줄이 넘치지 않도록 줄바꿈을 허용한다. */
    @media (max-width: 480px) {
      .mc-page { padding: 10px !important; }
      .mc-brand-inner { padding: 16px 14px !important; }
    }
    .mc-title-row { flex-wrap: wrap; justify-content: space-between; row-gap: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ── CONSTANTS ─────────────────────────────────────────────────────────────
    const CATS = [
      { label: "생활/주방",    fee: 11   },
      { label: "뷰티/코스메틱", fee: 11.5 },
      { label: "패션/의류",    fee: 14   },
      { label: "패션잡화",     fee: 12   },
      { label: "스포츠/레저",  fee: 11   },
      { label: "가전/디지털",  fee: 10.8 },
      { label: "식품/건강",    fee: 10.8 },
      { label: "반려동물",     fee: 11   },
      { label: "완구/취미",    fee: 11   },
      { label: "유아동",       fee: 11.5 },
      { label: "직접입력",     fee: null },
    ];
    const RKTS = [
      { label: "극소형 (50g 이하)",  fee: 1800 },
      { label: "소형 (2kg 이하)",    fee: 2500 },
      { label: "중형 (5kg 이하)",    fee: 3500 },
      { label: "대형 (10kg 이하)",   fee: 5000 },
      { label: "특대형 (10kg 초과)", fee: 7500 },
      { label: "직접입력",           fee: null  },
    ];

    // ── HELPERS ───────────────────────────────────────────────────────────────
    const nv  = v => parseFloat(String(v).replace(/,/g, "")) || 0;
    const fmt = n => Math.round(n).toLocaleString("ko-KR");
    const fp  = (n, d = 1) => Number(n).toFixed(d);
    const mc  = r => r >= 20 ? "#4ADE80" : r >= 10 ? "#FACC15" : r >= 0 ? "#FB923C" : "#F87171";

    const INPUT_STYLE = {
      width: "100%", padding: "8px 10px", borderRadius: 6, outline: "none",
      background: "#FFFDF8", border: "1px solid #DCD5C3", color: "#1B2A3D",
      fontSize: 14, fontFamily: "JetBrains Mono, monospace",
    };
    const SELECT_STYLE = {
      width: "100%", padding: "8px 10px", background: "#FFFDF8",
      border: "1px solid #DCD5C3", borderRadius: 6, color: "#1B2A3D",
      fontSize: 13, marginBottom: 8, cursor: "pointer", outline: "none",
    };

    // ── UI COMPONENTS (App 바깥에 정의 — 리렌더링 시 재생성 방지) ─────────────

    function SL({ text }) {
      return (
        <div style={{ fontSize: 10, color: "#8B95A1", marginBottom: 4,
          letterSpacing: "0.07em", textTransform: "uppercase", fontWeight: 700 }}>
          {text}
        </div>
      );
    }

    function NumIn({ label, unit, value, onChange, placeholder }) {
      return (
        <div style={{ marginBottom: 12 }}>
          <SL text={label + (unit ? ` (${unit})` : "")} />
          <input
            type="text"
            inputMode="decimal"
            value={value}
            onChange={e => onChange(e.target.value)}
            placeholder={placeholder}
            style={INPUT_STYLE}
          />
        </div>
      );
    }

    function TextIn({ label, value, onChange, placeholder, mono }) {
      return (
        <div style={{ marginBottom: 12 }}>
          {label && <SL text={label} />}
          <input
            type="text"
            value={value}
            onChange={e => onChange(e.target.value)}
            placeholder={placeholder}
            style={{ ...INPUT_STYLE,
              fontFamily: mono ? "JetBrains Mono, monospace" : "'Noto Sans KR', sans-serif",
              fontSize: mono ? 11 : 13 }}
          />
        </div>
      );
    }

    function Seg({ options, current, onChange }) {
      return (
        <div style={{ display: "flex", background: "#EDE7D8", borderRadius: 8,
          padding: 3, border: "1px solid #DCD5C3", marginBottom: 12 }}>
          {options.map(o => (
            <button key={o.v} onClick={() => onChange(o.v)}
              style={{ flex: 1, padding: "7px 4px", borderRadius: 6, border: "none",
                cursor: "pointer", transition: "all .15s",
                background: current === o.v ? "#C2703D" : "transparent",
                color: current === o.v ? "#fff" : "#5F6B78",
                fontSize: 12, fontWeight: 700 }}>
              {o.l}
            </button>
          ))}
        </div>
      );
    }

    function Toggle({ label, value, onChange }) {
      return (
        <div style={{ display: "flex", alignItems: "center",
          justifyContent: "space-between", marginBottom: 12 }}>
          <span style={{ fontSize: 13, color: "#8B95A1" }}>{label}</span>
          <button onClick={() => onChange(!value)}
            style={{ width: 44, height: 24, borderRadius: 12, border: "none",
              cursor: "pointer", background: value ? "#C2703D" : "#DCD5C3",
              position: "relative", transition: "background .2s" }}>
            <span style={{ position: "absolute", top: 3, width: 18, height: 18,
              left: value ? 23 : 3, borderRadius: "50%", background: "#fff",
              boxShadow: "0 1px 3px rgba(0,0,0,0.25)",
              transition: "left .2s", display: "block" }} />
          </button>
        </div>
      );
    }

    function CostRow({ label, value, accent, bold }) {
      return (
        <div style={{ display: "flex", justifyContent: "space-between",
          padding: "5px 0", borderBottom: "1px solid #DCD5C3" }}>
          <span style={{ fontSize: 12, color: bold ? "#1B2A3D" : "#5F6B78",
            fontWeight: bold ? 700 : 400 }}>{label}</span>
          <span style={{ fontSize: 12, fontFamily: "JetBrains Mono, monospace",
            color: accent || (bold ? "#8B95A1" : "#5F6B78"),
            fontWeight: bold ? 700 : 400 }}>
            {fmt(value)}원
          </span>
        </div>
      );
    }

    function Card({ children, style: extra = {} }) {
      return (
        <div style={{ background: "#FFFFFF", borderRadius: 12,
          padding: "16px 18px", border: "1px solid #DCD5C3",
          boxShadow: "0 1px 3px rgba(20,20,10,0.04)",
          marginBottom: 14, ...extra }}>
          {children}
        </div>
      );
    }

    function PH({ children }) {
      return (
        <div style={{ fontSize: 10, color: "#5F6B78", fontWeight: 700,
          textTransform: "uppercase", letterSpacing: "0.12em", marginBottom: 12 }}>
          {children}
        </div>
      );
    }

    function Sec({ emoji, title, children }) {
      return (
        <div style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8,
            paddingBottom: 8, marginBottom: 12, borderBottom: "1px solid #DCD5C3" }}>
            <span style={{ fontSize: 14 }}>{emoji}</span>
            <span style={{ fontSize: 10, fontWeight: 700, color: "#5F6B78",
              textTransform: "uppercase", letterSpacing: "0.1em" }}>{title}</span>
          </div>
          {children}
        </div>
      );
    }

    // ── MAIN APP ──────────────────────────────────────────────────────────────
    
    /* ══════════════════════════════════════════════════════════════
       통관 정밀 계산 (Margin Calculator v10 로직 이식)

       원본 공식
         묶음별 중국원가(CNY) = 본품단가×수량 + 옵션합 + 중국내륙비 + 기타작업비
         개당원가(원)         = 중국원가/수량 × 환율
         세금 안분            = 신고금액(USD) 비율   (혼적 모드)
         물류비 안분          = CBM 비율             (혼적 모드)
         일반 모드            = 둘 다 수량 비율
         최종 개당원가        = 개당원가 + (세금분 + 물류분 + 공통수수료분) ÷ 수량
       ══════════════════════════════════════════════════════════════ */

    // 인보이스 항목 자동분류 키워드 (원본 앱과 동일)
    const COST_DEFS = [
      { key:"duty",     name:"관세",                 kind:"TAX",
        keys:["관세","수입관세","DUTY","CUSTOMSDUTY","CUSTOMS DUTY","IMPORTDUTY","IMPORT DUTY","TAX"] },
      { key:"vat",      name:"부가세",               kind:"TAX",
        keys:["부가세","부가가치세","수입부가세","VAT","V.A.T","VALUEADDEDTAX","VALUE ADDED TAX"] },
      { key:"clear",    name:"통관수수료",           kind:"LOG",
        keys:["CUSTOMS","CUSTOMS CLEARANCE","CLEARANCE","BROKERAGE","통관수수료","통관료","관세사수수료"] },
      { key:"origin",   name:"원산지 발급비용",      kind:"LOG",
        keys:["CERTIFICATE","CERTIFICATE OF ORIGIN","C/O","CERT OF ORIGIN","ORIGIN","원산지증명","원산지증명서","원산지발급","원산지발급비용"] },
      { key:"doc",      name:"서류발급비용",         kind:"LOG",
        keys:["DOCUMENT","DOCUMENT FEE","DOCUMENTATION","DOCFEE","서류발급비","서류발급비용"] },
      { key:"dofee",    name:"D/O CHARGE",           kind:"LOG",
        keys:["D/O","DOFEE","DELIVERY ORDER","O/OCHARGE","D/O CHARGE","D/OFEE"] },
      { key:"truck",    name:"내륙 운송비",          kind:"LOG",
        keys:["TRUCK","TRUCKING","INLAND","LOCAL TRANSPORT","DELIVERY","트럭","내륙운송","운송료","운송비","운송","배송비","셔틀비","셔틀","지방합차","합차","혼적","PICKUP","DRAYAGE"] },
      { key:"ocean",    name:"해상운임·기타",        kind:"LOG",
        keys:["OCEAN","O/F","SEA FREIGHT","OCEAN FREIGHT","해상운임","해운임","해운비","중국해운비","FREIGHT","AIRFREIGHT","항공운임","TERMINAL","THC","터미널","C.F.S","CFS","작업료","하역료","HANDLING","H/C","취급수수료","OTHER","OTHERS","기타비용","MISC","STORAGE","보관료","창고료","WAREHOUSE","WHARFAGE","입항료","부두사용료","BAF","CAF","LSS","PSS","PCS","SEAL","봉인비","BOOKING","부킹비","EDI","전송료","B/L","OBL","발행수수료","AWB","AMS","PALLET","팔레트","FORKLIFT","지게차","LOADING","상차","UNLOADING","하차","REPACKING","재포장","LABELING","라벨링","SORTING","분류작업","QUARANTINE","검역","FUMIGATION","훈증","INSPECTION","검사비","X-RAY","검색료","CLEANING","세척비","보험료","DEMURRAGE","DETENTION","지체료","체화료","CIC","CRC","BUNKER","SULPHUR"] },
    ];
    // 인보이스 헤더/푸터 등 금액이 아닌 행을 걸러내는 단어
    const IGNORE_WORDS = ["NO.","DATE","REF","VSL","VOY","TEL","FAX","REMARK","계좌","은행","BANK","ACCOUNT",
      "TOTAL","합계","CARTON","PACKAGE","POD","POL","ETA","ETD","CUSTOMER","INVOICE","QTY","Q'TY","VESSEL",
      "WEIGHT","MEASUREMENT","CBM","KGS","대표이사","대표","SIGNATURE","SIGN","AUTHORIZED"];

    const norm = (v) => String(v == null ? "" : v).toUpperCase().replace(/\s|\.|_|-/g, "");
    function classifyCost(label) {
      const t = norm(label);
      if (!t) return null;
      if (IGNORE_WORDS.some(w => t === norm(w))) return null;
      for (const d of COST_DEFS) {
        if (d.keys.some(k => t.includes(norm(k)))) return d.key;
      }
      return null;
    }

    const mkBundle = (id) => ({
      id, name: "", qty: "", unitCny: "", optCny: "", inlandCny: "",
      cbm: "", usd: ""
    });

    /* 통관 정밀 계산 탭 본체 */
    function CustomsTab({ xrCny, xrUsd, onApply, regRef }) {
      const [bundles, setBundles]   = React.useState(() => [mkBundle(1)]);
      const [costs, setCosts]       = React.useState(() =>
        COST_DEFS.reduce((a, d) => (a[d.key] = "", a), {}));
      const [agencyPct, setAgencyPct] = React.useState("");
      const [lclMode, setLclMode]   = React.useState(false);
      const [lclTotalCbm, setLclTotalCbm] = React.useState("");
      const [lclTotalUsd, setLclTotalUsd] = React.useState("");
      const [msg, setMsg]           = React.useState("");
      const [costLog, setCostLog]   = React.useState([]);

      const rate = nv(xrCny) || 0;

      /* 저장 보관함이 이 탭의 내용도 함께 담을 수 있게 등록해 둔다 */
      if (regRef) regRef.current = {
        collect: () => ({ bundles, costs, agencyPct, lclMode, lclTotalCbm, lclTotalUsd, costLog }),
        restore: (d) => {
          if (!d) return;
          if (Array.isArray(d.bundles) && d.bundles.length) setBundles(d.bundles);
          if (d.costs && typeof d.costs === "object") setCosts(d.costs);
          if (d.agencyPct    !== undefined) setAgencyPct(d.agencyPct);
          if (d.lclMode      !== undefined) setLclMode(Boolean(d.lclMode));
          if (d.lclTotalCbm  !== undefined) setLclTotalCbm(d.lclTotalCbm);
          if (d.lclTotalUsd  !== undefined) setLclTotalUsd(d.lclTotalUsd);
          setCostLog(Array.isArray(d.costLog) ? d.costLog : []);
        }
      };

      const setCost = (k, v) => setCosts(p => ({ ...p, [k]: v }));
      const updB = (i, k, v) => setBundles(p => p.map((b, j) => j === i ? { ...b, [k]: v } : b));
      const addB = () => setBundles(p => [...p, mkBundle(Date.now())]);
      const delB = (i) => setBundles(p => p.length > 1 ? p.filter((_, j) => j !== i) : p);

      /* ── 엑셀: 출고리스트 읽기 ── */
      const readShipping = async (file) => {
        setMsg("");
        try {
          if (!window.XLSX) { setMsg("엑셀 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해주세요."); return; }
          const buf = await file.arrayBuffer();
          const wb = XLSX.read(buf, { type: "array" });
          const findHeader = (rows, needs) => {
            for (let r = 0; r < Math.min(rows.length, 40); r++) {
              const row = rows[r] || [];
              const map = {};
              row.forEach((c, i) => {
                const t = String(c == null ? "" : c).replace(/\s/g, "");
                needs.forEach(n => { if (t.includes(n) && map[n] === undefined) map[n] = i; });
              });
              if (needs.every(n => map[n] !== undefined)) return { rowIdx: r, colMap: map };
            }
            return null;
          };
          // '출고' 또는 SHIPPING 시트 우선, 없으면 헤더로 탐색
          let sheetName = wb.SheetNames.find(n => n && (n.includes("출고") || n.toUpperCase().includes("SHIPPING")));
          let rows = null, head = null;
          const NEED = ["한글품명", "수량", "체적"];
          const trySheet = (n) => {
            const ws = wb.Sheets[n]; if (!ws) return null;
            const rr = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, blankrows: true });
            const hh = findHeader(rr, NEED);
            return hh ? { rows: rr, head: hh, ws } : null;
          };
          let picked = sheetName ? trySheet(sheetName) : null;
          if (!picked) for (const n of wb.SheetNames) { picked = trySheet(n); if (picked) { sheetName = n; break; } }
          if (!picked) { setMsg("'출고리스트' 역할을 하는 시트를 찾지 못했습니다. (한글품명·수량·체적 열이 필요합니다)"); return; }
          rows = picked.rows; head = picked.head;
          const merges = (picked.ws["!merges"]) || [];
          const cm = head.colMap;
          // 선택 열(있으면 사용)
          const extra = {};
          (rows[head.rowIdx] || []).forEach((c, i) => {
            const t = String(c == null ? "" : c).replace(/\s/g, "");
            if (t.includes("신고총금액")) extra.usd = i;
            if (t.includes("옵션")) extra.opt = i;
          });
          const out = [];
          let r = head.rowIdx + 1;
          while (r < rows.length) {
            const row = rows[r] || [];
            const nameCell = row[cm["한글품명"]];
            if (!nameCell || String(nameCell).toUpperCase().includes("TOTAL")) { r++; continue; }
            // 병합셀이면 마지막 행까지 묶어서 합산
            let endR = r;
            const mg = merges.find(m => m && m.s && m.e && m.s.r <= r && m.e.r >= r
              && m.s.c <= cm["한글품명"] && m.e.c >= cm["한글품명"]);
            if (mg) endR = mg.e.r;
            let qty = 0, cbm = 0, usd = 0;
            for (let k = r; k <= endR; k++) {
              const rw = rows[k] || [];
              qty += nv(rw[cm["수량"]]);
              cbm += nv(rw[cm["체적"]]);
              if (extra.usd !== undefined) usd += nv(rw[extra.usd]);
            }
            out.push({ id: Date.now() + r, name: String(nameCell).trim(), qty: String(qty || ""),
              unitCny: "", optCny: "", inlandCny: "",
              cbm: cbm ? String(Math.round(cbm * 1000) / 1000) : "",
              usd: usd ? String(Math.round(usd * 100) / 100) : "" });
            r = endR + 1;
          }
          if (!out.length) { setMsg("출고리스트에서 상품 행을 찾지 못했습니다."); return; }
          setBundles(out);
          setMsg(`'${sheetName}' 시트에서 ${out.length}개 상품을 읽었습니다. 중국 단가(CNY)는 직접 입력해주세요.`);
        } catch (e) {
          setMsg("엑셀 파일을 읽는 중 오류가 발생했습니다: " + (e && e.message ? e.message : ""));
        }
      };

      /* ── 엑셀: 인보이스 읽기 → 8개 항목 자동분류 ── */
      const readInvoice = async (file) => {
        setMsg(""); setCostLog([]);
        try {
          if (!window.XLSX) { setMsg("엑셀 모듈을 불러오지 못했습니다."); return; }
          const buf = await file.arrayBuffer();
          const wb = XLSX.read(buf, { type: "array" });
          const acc = {}, log = [];
          COST_DEFS.forEach(d => acc[d.key] = 0);
          for (const sn of wb.SheetNames) {
            const ws = wb.Sheets[sn]; if (!ws) continue;
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, blankrows: false });
            rows.forEach(row => {
              if (!row) return;
              // 행 안에서 라벨(문자)과 금액(숫자)을 찾는다
              let label = "", amount = 0;
              row.forEach(c => {
                if (c == null) return;
                if (typeof c === "number") { if (Math.abs(c) > Math.abs(amount)) amount = c; }
                else {
                  const t = String(c).trim();
                  const numeric = Number(t.replace(/[,\s₩$]/g, ""));
                  if (t && isNaN(numeric)) { if (t.length > label.length) label = t; }
                  else if (!isNaN(numeric) && Math.abs(numeric) > Math.abs(amount)) amount = numeric;
                }
              });
              if (!label || !amount) return;
              const key = classifyCost(label);
              if (key) { acc[key] += amount; log.push({ label, amount, key }); }
            });
          }
          const any = Object.values(acc).some(v => v > 0);
          if (!any) { setMsg("인보이스에서 인식할 수 있는 비용 항목을 찾지 못했습니다. 아래 칸에 직접 입력해주세요."); return; }
          setCosts(p => {
            const n = { ...p };
            COST_DEFS.forEach(d => { if (acc[d.key] > 0) n[d.key] = String(Math.round(acc[d.key])); });
            return n;
          });
          setCostLog(log);
          setMsg(`인보이스에서 ${log.length}개 행을 인식했습니다. 아래 금액을 확인하고 필요하면 수정해주세요.`);
        } catch (e) {
          setMsg("인보이스를 읽는 중 오류가 발생했습니다: " + (e && e.message ? e.message : ""));
        }
      };

      /* ── 계산 ── */
      const R = React.useMemo(() => {
        const bs = bundles.map(b => {
          const qty = nv(b.qty);
          const cnyTotal = nv(b.unitCny) * qty + nv(b.optCny) + nv(b.inlandCny);
          return { ...b, qty, cnyTotal, totalKrw: cnyTotal * rate,
            unitKrw: qty > 0 ? (cnyTotal / qty) * rate : cnyTotal * rate };
        });
        const totalQty  = bs.reduce((s, b) => s + b.qty, 0);
        const totalCny  = bs.reduce((s, b) => s + b.cnyTotal, 0);
        const totalKrw  = bs.reduce((s, b) => s + b.totalKrw, 0);
        const sumCbm    = bs.reduce((s, b) => s + nv(b.cbm), 0);
        const sumUsd    = bs.reduce((s, b) => s + nv(b.usd), 0);

        // 인보이스 합계
        let tax = 0, log = 0;
        COST_DEFS.forEach(d => {
          const v = nv(costs[d.key]);
          if (d.kind === "TAX") tax += v; else log += v;
        });
        // 혼적: 전체 화물에서 내 몫만 추출
        let myTax = tax, myLog = log;
        if (lclMode) {
          const tU = nv(lclTotalUsd), tC = nv(lclTotalCbm);
          if (tU > 0) myTax = tax * (sumUsd / tU);
          if (tC > 0) myLog = log * (sumCbm / tC);
        }
        // 묶음별 안분 (혼적이면 세금=신고금액 비율, 물류=CBM 비율 / 아니면 수량 비율)
        const taxR = Math.round(myTax), logR = Math.round(myLog);
        let accT = 0, accL = 0;
        const withShare = bs.map((b, i) => {
          let t, l;
          if (lclMode) {
            t = sumUsd > 0 ? taxR * (nv(b.usd) / sumUsd) : (totalQty > 0 ? taxR * (b.qty / totalQty) : taxR / bs.length);
            l = sumCbm > 0 ? logR * (nv(b.cbm) / sumCbm) : (totalQty > 0 ? logR * (b.qty / totalQty) : logR / bs.length);
          } else {
            t = totalQty > 0 ? taxR * (b.qty / totalQty) : taxR / bs.length;
            l = totalQty > 0 ? logR * (b.qty / totalQty) : logR / bs.length;
          }
          let ti = Math.round(t), li = Math.round(l);
          if (i === bs.length - 1) { ti = taxR - accT; li = logR - accL; }
          else { accT += ti; accL += li; }
          return { ...b, taxShare: ti, logShare: li };
        });
        // 공통 수수료(구매대행 등) — 중국원가 비율로 안분
        const agencyCny = totalCny * (nv(agencyPct) / 100);
        const agencyKrw = Math.round(agencyCny * rate);
        let accA = 0;
        const final = withShare.map((b, i) => {
          let a = totalKrw > 0 ? agencyKrw * (b.totalKrw / totalKrw)
                : (totalQty > 0 ? agencyKrw * (b.qty / totalQty) : agencyKrw / withShare.length);
          let ai = Math.round(a);
          if (i === withShare.length - 1) ai = agencyKrw - accA; else accA += ai;
          const add = ai + b.taxShare + b.logShare;
          return { ...b, agencyShare: ai, addTotal: add,
            finalUnit: b.qty > 0 ? b.unitKrw + add / b.qty : b.unitKrw + add };
        });
        return { bs: final, totalQty, totalCny, totalKrw, sumCbm, sumUsd,
          tax, log, myTax, myLog, agencyKrw,
          grandTotal: Math.round(totalKrw) + taxR + logR + agencyKrw };
      }, [bundles, costs, agencyPct, lclMode, lclTotalCbm, lclTotalUsd, rate]);

      const W = (n) => (isFinite(n) ? Math.round(n).toLocaleString("ko-KR") : "0");

      const box = { background:"#FFFDF8", border:"1px solid #DCD5C3", borderRadius:12, padding:14, marginBottom:12 };
      const lab = { fontSize:11.5, fontWeight:800, color:"#6B7684", marginBottom:5, display:"block" };
      const inp = { width:"100%", padding:"8px 10px", border:"1px solid #DCD5C3", borderRadius:8,
        fontSize:13, fontFamily:"inherit", background:"#fff", boxSizing:"border-box" };
      const btn = { padding:"9px 14px", borderRadius:9, border:"1px solid #DCD5C3", background:"#fff",
        fontSize:12.5, fontWeight:800, cursor:"pointer", fontFamily:"inherit", color:"#1B2A3D" };
      const btnGold = { ...btn, background:"#D98E3D", border:"none", color:"#fff" };

      return (
        <div style={{ maxWidth:1080, margin:"0 auto" }}>

          {/* 안내 */}
          <div style={{ ...box, background:"#F1EEE6", borderColor:"#E0D7C2" }}>
            <div style={{ fontSize:12.5, lineHeight:1.75, color:"#4A5568" }}>
              포워더 인보이스의 <b>실제 통관·물류비</b>를 상품별로 나눠 <b>개당 원가</b>를 구합니다.
              세금은 신고금액(USD) 비율, 물류비는 CBM 비율로 안분하는 실무 기준을 따릅니다.
              <br/>계산이 끝나면 아래 버튼으로 <b>간편 계산 탭</b>에 개당 원가를 그대로 넘길 수 있어요.
            </div>
          </div>

          {msg && (
            <div style={{ ...box, background:"#FBF3E4", borderColor:"#E5C98B", fontSize:12.5, lineHeight:1.7 }}>
              {msg}
            </div>
          )}

          {/* 1. 인보이스 */}
          <div style={box}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
              flexWrap:"wrap", gap:8, marginBottom:12 }}>
              <b style={{ fontSize:14 }}>① 통관·물류 비용 (인보이스)</b>
              <label style={{ ...btn, display:"inline-block" }}>
                엑셀 불러오기
                <input type="file" accept=".xlsx,.xls,.csv" style={{ display:"none" }}
                  onChange={e => { const f = e.target.files[0]; e.target.value=""; if (f) readInvoice(f); }} />
              </label>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))", gap:10 }}>
              {COST_DEFS.map(d => (
                <div key={d.key}>
                  <label style={lab}>
                    {d.name}
                    <span style={{ marginLeft:5, fontWeight:700,
                      color: d.kind === "TAX" ? "#B8453A" : "#5B7C99" }}>
                      {d.kind === "TAX" ? "세금" : "물류"}
                    </span>
                  </label>
                  <input style={inp} inputMode="numeric" placeholder="0"
                    value={costs[d.key]} onChange={e => setCost(d.key, e.target.value)} />
                </div>
              ))}
            </div>
            <div style={{ display:"flex", gap:16, marginTop:12, fontSize:12.5, flexWrap:"wrap" }}>
              <span>세금 합계 <b style={{ color:"#B8453A" }}>₩{W(R.tax)}</b></span>
              <span>물류비 합계 <b style={{ color:"#5B7C99" }}>₩{W(R.log)}</b></span>
            </div>
            {costLog.length > 0 && (
              <details style={{ marginTop:10 }}>
                <summary style={{ fontSize:12, color:"#6B7684", cursor:"pointer" }}>
                  자동 인식된 {costLog.length}개 행 보기
                </summary>
                <div style={{ marginTop:8, maxHeight:150, overflowY:"auto", fontSize:11.5, color:"#6B7684" }}>
                  {costLog.map((l, i) => (
                    <div key={i} style={{ padding:"3px 0", borderBottom:"1px solid #F0EBE0" }}>
                      {l.label} → <b>{COST_DEFS.find(d => d.key === l.key).name}</b> ₩{W(l.amount)}
                    </div>
                  ))}
                </div>
              </details>
            )}
          </div>

          {/* 2. 혼적 */}
          <div style={box}>
            <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:13.5, fontWeight:800 }}>
              <input type="checkbox" checked={lclMode} onChange={e => setLclMode(e.target.checked)} />
              ② 혼적(LCL) — 전체 화물 중 내 몫만 계산
            </label>
            {lclMode && (
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))", gap:10, marginTop:12 }}>
                <div><label style={lab}>전체 화물 총 CBM</label>
                  <input style={inp} inputMode="decimal" placeholder="예: 10.5"
                    value={lclTotalCbm} onChange={e => setLclTotalCbm(e.target.value)} /></div>
                <div><label style={lab}>전체 화물 총 신고금액 ($)</label>
                  <input style={inp} inputMode="decimal" placeholder="예: 5000"
                    value={lclTotalUsd} onChange={e => setLclTotalUsd(e.target.value)} /></div>
                <div style={{ gridColumn:"1/-1", fontSize:12, color:"#6B7684", lineHeight:1.7 }}>
                  내 몫 세금 <b>₩{W(R.myTax)}</b> · 내 몫 물류비 <b>₩{W(R.myLog)}</b>
                  <br/>(내 CBM {R.sumCbm.toFixed(2)} / 내 신고금액 ${R.sumUsd.toFixed(2)} 기준)
                </div>
              </div>
            )}
          </div>

          {/* 3. 상품 묶음 */}
          <div style={box}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
              flexWrap:"wrap", gap:8, marginBottom:12 }}>
              <b style={{ fontSize:14 }}>③ 상품 묶음 ({bundles.length}개)</b>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                <label style={{ ...btn, display:"inline-block" }}>
                  출고리스트 엑셀
                  <input type="file" accept=".xlsx,.xls,.csv" style={{ display:"none" }}
                    onChange={e => { const f = e.target.files[0]; e.target.value=""; if (f) readShipping(f); }} />
                </label>
                <button style={btn} onClick={addB}>+ 묶음 추가</button>
              </div>
            </div>

            {bundles.map((b, i) => (
              <div key={b.id} style={{ border:"1px solid #E8E1D2", borderRadius:10, padding:12, marginBottom:10 }}>
                <div style={{ display:"flex", gap:8, alignItems:"center", marginBottom:10 }}>
                  <input style={{ ...inp, fontWeight:800 }} placeholder={"상품명 " + (i+1)}
                    value={b.name} onChange={e => updB(i, "name", e.target.value)} />
                  {bundles.length > 1 && (
                    <button style={{ ...btn, padding:"8px 11px", color:"#B8453A" }}
                      onClick={() => delB(i)}>✕</button>
                  )}
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))", gap:9 }}>
                  <div><label style={lab}>수량</label>
                    <input style={inp} inputMode="numeric" placeholder="0"
                      value={b.qty} onChange={e => updB(i,"qty",e.target.value)} /></div>
                  <div><label style={lab}>본품 단가 (¥)</label>
                    <input style={inp} inputMode="decimal" placeholder="0"
                      value={b.unitCny} onChange={e => updB(i,"unitCny",e.target.value)} /></div>
                  <div><label style={lab}>옵션·부자재 (¥)</label>
                    <input style={inp} inputMode="decimal" placeholder="0"
                      value={b.optCny} onChange={e => updB(i,"optCny",e.target.value)} /></div>
                  <div><label style={lab}>중국 내륙비 (¥)</label>
                    <input style={inp} inputMode="decimal" placeholder="0"
                      value={b.inlandCny} onChange={e => updB(i,"inlandCny",e.target.value)} /></div>
                  <div><label style={lab}>CBM (체적)</label>
                    <input style={inp} inputMode="decimal" placeholder="0"
                      value={b.cbm} onChange={e => updB(i,"cbm",e.target.value)} /></div>
                  <div><label style={lab}>신고금액 ($)</label>
                    <input style={inp} inputMode="decimal" placeholder="0"
                      value={b.usd} onChange={e => updB(i,"usd",e.target.value)} /></div>
                </div>
              </div>
            ))}

            <div style={{ marginTop:6 }}>
              <label style={lab}>공통 수수료 (%) — 구매대행 등, 중국원가에 일괄 적용</label>
              <input style={{ ...inp, maxWidth:200 }} inputMode="decimal" placeholder="예: 5"
                value={agencyPct} onChange={e => setAgencyPct(e.target.value)} />
            </div>
          </div>

          {/* 4. 결과 */}
          <div style={{ ...box, background:"#1B2A3D", borderColor:"#1B2A3D", color:"#fff" }}>
            <b style={{ fontSize:14, display:"block", marginBottom:12 }}>④ 계산 결과</b>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",
              gap:10, marginBottom:14 }}>
              {[["중국 원가", "₩"+W(R.totalKrw)], ["세금", "₩"+W(R.myTax)],
                ["물류비", "₩"+W(R.myLog)], ["공통 수수료", "₩"+W(R.agencyKrw)],
                ["총 수입원가", "₩"+W(R.grandTotal)], ["총 수량", W(R.totalQty)+"개"]].map(([k,v]) => (
                <div key={k} style={{ background:"rgba(255,255,255,.07)", borderRadius:9, padding:"9px 11px" }}>
                  <div style={{ fontSize:10.5, color:"rgba(255,255,255,.55)", fontWeight:700 }}>{k}</div>
                  <div style={{ fontSize:15, fontWeight:900, marginTop:2 }}>{v}</div>
                </div>
              ))}
            </div>

            {R.bs.map((b, i) => (
              <div key={b.id} style={{ background:"rgba(255,255,255,.06)", borderRadius:10,
                padding:"11px 13px", marginBottom:8 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                  flexWrap:"wrap", gap:8 }}>
                  <b style={{ fontSize:13 }}>{b.name || "상품 " + (i+1)}</b>
                  <span style={{ fontSize:17, fontWeight:900, color:"#E8B563" }}>
                    개당 ₩{W(b.finalUnit)}
                  </span>
                </div>
                <div style={{ fontSize:11, color:"rgba(255,255,255,.55)", marginTop:5, lineHeight:1.7 }}>
                  (중국원가 ₩{W(b.totalKrw)} + 세금 ₩{W(b.taxShare)} + 물류 ₩{W(b.logShare)}
                  {b.agencyShare ? " + 수수료 ₩"+W(b.agencyShare) : ""}) ÷ {b.qty || 1}개
                </div>
                <button style={{ ...btnGold, marginTop:9, fontSize:12 }}
                  onClick={() => onApply(Math.round(b.finalUnit), b.name)}>
                  이 원가로 간편 계산하기 →
                </button>
              </div>
            ))}
            <div style={{ fontSize:11, color:"rgba(255,255,255,.45)", marginTop:10, lineHeight:1.7 }}>
              ※ 적용 환율 ¥1 = ₩{W(rate)} (간편 계산 탭의 환율 설정을 따릅니다)
            </div>
          </div>
        </div>
      );
    }


    function App() {
      const [tab, setTab] = useState("simple"); // "simple" | "customs"
      const customsRef = React.useRef(null);   // 통관 탭 상태 접근용
      const saveApi    = React.useRef(null);   // 저장 보관함이 쓰는 현재 상태 함수
      const [sp,    setSp   ] = useState("");
      const [ch,    setCh   ] = useState("rocket");
      const [ci,    setCi   ] = useState(0);
      const [ccf,   setCcf  ] = useState("11");
      const [cur,   setCur  ] = useState("CNY");
      const [bp,    setBp   ] = useState("");
      const [xrMode, setXrMode] = useState("manual"); // "manual" 수기입력 | "simple" 간편비율
      const [simRate, setSimRate] = useState("300");
      const [xrCny, setXrCny] = useState("227");
      const [xrUsd, setXrUsd] = useState("1535");
      const [cr,    setCr   ] = useState("8");
      const [vat,   setVat  ] = useState(true);
      const [fw,    setFw   ] = useState("2000");
      const [cl,    setCl   ] = useState("1000");
      const [ri,    setRi   ] = useState(1);
      const [crf,   setCrf  ] = useState("2500");
      const [promo, setPromo] = useState("none"); // "none" | "90" | "270" (로켓그로스 비용 제로 프로모션)
      const [ms,    setMs   ] = useState("3000");
      const [ar,    setAr   ] = useState("7");
      const [rr,    setRr   ] = useState("3");
      const [tm,    setTm   ] = useState("30");
      const [taxType, setTaxType] = useState("simple_tax"); // "exempt" | "simple_tax" | "general"

      // ── 상품 정보 ──
      const [pName,    setPName   ] = useState("");
      const [url1688,  setUrl1688 ] = useState("");
      const [mCat,     setMCat    ] = useState("ACTIVE");
      const [pMemo,    setPMemo   ] = useState("");
      // 옵션: {name, imgUrl, bp, inputMode("margin"|"price"), targetMargin, sp}
      const mkOpt = (n) => ({ name: `옵션 ${n}`, imgUrl: "", bp: "", inputMode: "margin", targetMargin: tm, sp: "" });
      const [options,   setOptions  ] = useState(() => [mkOpt(1)]);
      const [activeOpt, setActiveOpt] = useState(0);
      // ── UI 상태 ──
      const [showSaved,  setShowSaved ] = useState(false);
      const [filterCat,  setFilterCat ] = useState("ALL");
      const [copiedLink, setCopiedLink] = useState(false);
      const [editingId,  setEditingId ] = useState(null); // 불러온 항목의 savedAt (덮어쓰기용)
      const [savedList,  setSavedList ] = useState(() => {
        try { return JSON.parse(localStorage.getItem("moriva_margin_v1") || "[]"); } catch { return []; }
      });

      // ── GitHub 동기화 상태 ──
      const [ghToken,      setGhToken     ] = useState(() => localStorage.getItem("moriva_gh_token") || "");
      const [ghRepo,       setGhRepo      ] = useState(() => localStorage.getItem("moriva_gh_repo") || "");
      const [ghPath,       setGhPath      ] = useState(() => localStorage.getItem("moriva_gh_path") || "moriva_margin_data.json");
      const [ghSha,        setGhSha       ] = useState(null);
      const [syncStatus,   setSyncStatus  ] = useState("idle"); // idle | loading | success | error | notfound
      const [showGhPanel,  setShowGhPanel ] = useState(false);
      const didInitPull    = useRef(false);
      const ghConfigured   = ghToken.trim() !== "" && ghRepo.trim() !== "";

      const simpleMode = cur !== "KRW" && xrMode === "simple";

      // ── SAVE / LOAD ──────────────────────────────────────────────────────────
      const MCAT_COLORS = {
        ACTIVE:"#C2703D", CAMP:"#16A34A", HOME:"#2563EB", PET:"#9333EA", BAG:"#CA8A04"
      };

      // 옵션 헬퍼
      const addOpt = () => {
        setOptions(prev => {
          const next = [...prev, mkOpt(prev.length + 1)];
          setActiveOpt(next.length - 1); // 새 옵션 즉시 활성화
          return next;
        });
      };
      const updateOpt = (i, key, val) =>
        setOptions(prev => prev.map((o, j) => j === i ? { ...o, [key]: val } : o));
      const removeOpt = (i) => {
        if (options.length <= 1) return; // 최소 1개 유지
        setOptions(prev => prev.filter((_, j) => j !== i));
        if (activeOpt >= i && activeOpt > 0) setActiveOpt(activeOpt - 1);
      };
      // 스위치: 계산된 값을 반대 모드의 입력값으로 이전
      const toggleMode = (i, res) => {
        setOptions(prev => prev.map((o, j) => {
          if (j !== i) return o;
          if (o.inputMode === "margin") {
            // 계산된 판매가 → 판매가 입력칸으로 이전, 판매가 모드로 전환
            return { ...o, inputMode: "price", sp: res && res.sp > 0 ? String(Math.round(res.sp)) : o.sp };
          } else {
            // 계산된 마진율 → 목표 마진율 입력칸으로 이전, 마진율 모드로 전환
            return { ...o, inputMode: "margin", targetMargin: res ? fp(res.marginRate) : o.targetMargin };
          }
        }));
      };

      // 옵션별 계산 (비활성 옵션 표시용)
      const computeOpt = (opt) => {
        const effR = xrMode === "simple" ? nv(simRate) : cur === "CNY" ? nv(xrCny) : nv(xrUsd);
        const bk = cur === "KRW" ? nv(opt.bp) : nv(opt.bp) * effR;
        const cst = simpleMode ? 0 : bk * (nv(cr)/100);
        const vt  = simpleMode ? 0 : (vat ? (bk + cst) * 0.1 : 0);
        const imp = bk + cst + vt + (simpleMode ? 0 : nv(fw)) + (simpleMode ? 0 : nv(cl));
        const catF = CATS[ci].fee !== null ? CATS[ci].fee : nv(ccf);
        const log  = (ch === "rocket" && promo === "90") ? 0
          : ch === "rocket" ? (RKTS[ri].fee !== null ? RKTS[ri].fee : nv(crf)) : nv(ms);
        const pA = ch === "rocket" && promo !== "none";
        const varR = catF/100 + nv(ar)/100 + (pA ? 0 : nv(rr)/100 * 0.3);
        const fixC = imp + log;
        if (opt.inputMode === "price") {
          const SP = nv(opt.sp);
          const mr = SP > 0 ? ((SP - fixC - SP*varR) / SP * 100) : 0;
          return { sp: SP, marginRate: mr };
        } else {
          const tgt = nv(opt.targetMargin);
          const denom = 1 - varR - tgt/100;
          const SP = denom > 0.001 ? fixC / denom : 0;
          return { sp: SP, marginRate: tgt };
        }
      };

      const collectState = () => ({
        pName, url1688, mCat, pMemo, options, activeOpt,
        sp, ch, ci: String(ci), ccf, cur, bp,
        xrMode, simRate, xrCny, xrUsd,
        cr, vat: vat ? "1" : "0", fw, cl,
        ri: String(ri), crf, promo, ms, ar, rr, tm, taxType
      });
      const restoreState = (s) => {
        if (s.pName   !== undefined) setPName(s.pName);
        if (s.url1688 !== undefined) setUrl1688(s.url1688);
        if (s.mCat    !== undefined) setMCat(s.mCat);
        if (s.pMemo   !== undefined) setPMemo(s.pMemo);
        if (s.options !== undefined && Array.isArray(s.options) && s.options.length > 0) {
          // 구버전 옵션 구조 마이그레이션 (imgUrl, inputMode, targetMargin 없으면 기본값 추가)
          const migrated = s.options.map((o, i) => ({
            name: o.name || `옵션 ${i+1}`,
            imgUrl: o.imgUrl || "",
            bp: o.bp || "",
            inputMode: o.inputMode || "margin",
            targetMargin: o.targetMargin || s.tm || "30",
            sp: o.sp || "",
          }));
          setOptions(migrated);
          setActiveOpt(typeof s.activeOpt === "number" ? s.activeOpt : 0);
        } else {
          setOptions([mkOpt(1)]); setActiveOpt(0);
        }
        if (s.sp      !== undefined) setSp(s.sp);
        if (s.ch      !== undefined) setCh(s.ch);
        if (s.ci      !== undefined) setCi(Number(s.ci));
        if (s.ccf     !== undefined) setCcf(s.ccf);
        if (s.cur     !== undefined) setCur(s.cur);
        if (s.bp      !== undefined) setBp(s.bp);
        if (s.xrMode  !== undefined) setXrMode(s.xrMode);
        if (s.simRate  !== undefined) setSimRate(s.simRate);
        if (s.xrCny   !== undefined) setXrCny(s.xrCny);
        if (s.xrUsd   !== undefined) setXrUsd(s.xrUsd);
        if (s.cr      !== undefined) setCr(s.cr);
        if (s.vat     !== undefined) setVat(s.vat === "1" || s.vat === true);
        if (s.fw      !== undefined) setFw(s.fw);
        if (s.cl      !== undefined) setCl(s.cl);
        if (s.ri      !== undefined) setRi(Number(s.ri));
        if (s.crf     !== undefined) setCrf(s.crf);
        if (s.promo   !== undefined) setPromo(s.promo);
        if (s.ms      !== undefined) setMs(s.ms);
        if (s.ar      !== undefined) setAr(s.ar);
        if (s.rr      !== undefined) setRr(s.rr);
        if (s.tm      !== undefined) setTm(s.tm);
        if (s.taxType !== undefined) setTaxType(s.taxType);
      };
      /* ── 저장 보관함 (이름 붙여 저장 / 불러오기 / 삭제) ── */
      saveApi.current = {
        collect: () => ({
          v: 2,
          tab,
          main: collectState(),
          customs: customsRef.current ? customsRef.current.collect() : null
        }),
        restore: (d) => {
          if (!d) return;
          // 예전 형식(본 계산 값만 저장한 경우)도 그대로 불러온다
          const main = d.main || d;
          restoreState(main);
          if (d.customs && customsRef.current) customsRef.current.restore(d.customs);
          if (d.tab) setTab(d.tab);
          window.scrollTo({ top: 0, behavior: "smooth" });
        },
        hint: () => (collectState().pName || "").trim(),
        summary: (d) => {
          const m = (d && d.main) || d || {};
          const nm = (m.mCat || "").trim();
          return (nm ? nm + " · " : "") + (d && d.customs && (d.customs.bundles || []).length > 1
            ? "통관 " + d.customs.bundles.length + "묶음" : "간편 계산");
        }
      };

      React.useEffect(() => {
        const start = () => {
          if (!window.MorivaSaves) { setTimeout(start, 300); return; }
          window.MorivaSaves.init({
            storeKey: "moriva_margin_saves_v1",
            title: "마진 계산",
            collect : () => saveApi.current.collect(),
            restore : (d) => saveApi.current.restore(d),
            nameHint: () => saveApi.current.hint(),
            summary : (d) => saveApi.current.summary(d)
          });
        };
        start();
      }, []);

      const persist = (list, skipGh = false) => {
        setSavedList(list);
        localStorage.setItem("moriva_margin_v1", JSON.stringify(list));
        if (!skipGh && ghConfigured) pushToGitHub(list);
      };

      // ── GitHub API ────────────────────────────────────────────────────────────
      const ghApiUrl = () =>
        `https://api.github.com/repos/${ghRepo.trim()}/contents/${ghPath.trim()}`;
      const ghHeaders = () => ({
        "Authorization": `Bearer ${ghToken.trim()}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json",
        "X-GitHub-Api-Version": "2022-11-28"
      });

      const pullFromGitHub = async () => {
        if (!ghConfigured) return;
        setSyncStatus("loading");
        try {
          const res = await fetch(ghApiUrl(), { headers: ghHeaders() });
          if (res.status === 404) { setSyncStatus("notfound"); return; }
          if (!res.ok) throw new Error(res.status);
          const data = await res.json();
          setGhSha(data.sha);
          const parsed = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
          if (Array.isArray(parsed)) {
            // 병합: savedAt 기준 중복 제거 후 최신 100개 유지
            const merged = Object.values(
              [...parsed, ...JSON.parse(localStorage.getItem("moriva_margin_v1") || "[]")]
                .reduce((acc, it) => { acc[it.savedAt] = it; return acc; }, {})
            ).sort((a, b) => b.savedAt - a.savedAt).slice(0, 100);
            setSavedList(merged);
            localStorage.setItem("moriva_margin_v1", JSON.stringify(merged));
          }
          setSyncStatus("success");
        } catch (e) {
          console.error("GitHub pull error:", e);
          setSyncStatus("error");
        }
      };

      const pushToGitHub = async (list) => {
        if (!ghConfigured) return;
        setSyncStatus("loading");
        try {
          // SHA 없으면 먼저 확인
          let sha = ghSha;
          if (!sha) {
            const check = await fetch(ghApiUrl(), { headers: ghHeaders() });
            if (check.ok) { const d = await check.json(); sha = d.sha; setGhSha(d.sha); }
          }
          const content = btoa(unescape(encodeURIComponent(JSON.stringify(list, null, 2))));
          const body = {
            message: `MORIVA 마진 데이터 업데이트 · ${new Date().toLocaleString("ko-KR")}`,
            content,
            ...(sha ? { sha } : {})
          };
          const res = await fetch(ghApiUrl(), {
            method: "PUT", headers: ghHeaders(), body: JSON.stringify(body)
          });
          if (!res.ok) throw new Error(res.status);
          const result = await res.json();
          setGhSha(result.content.sha);
          setSyncStatus("success");
        } catch (e) {
          console.error("GitHub push error:", e);
          setSyncStatus("error");
        }
      };

      // 앱 시작 시 GitHub에서 자동 pull
      useEffect(() => {
        if (!didInitPull.current && ghConfigured) {
          didInitPull.current = true;
          pullFromGitHub();
        }
      }, [ghConfigured]);
      const saveItem = () => {
        const optsSnap = options.map((o, i) => {
          const res = i === activeOpt ? { sp: C.SP, marginRate: C.marginRate } : computeOpt(o);
          return { ...o, _sp: res.sp, _marginRate: res.marginRate.toFixed(1) };
        });
        const now = editingId || Date.now();
        const item = {
          ...collectState(), options: optsSnap,
          savedAt: now, _marginRate: C.marginRate.toFixed(1)
        };
        // 같은 항목(editingId)이면 제자리 업데이트, 아니면 맨 앞에 추가
        const next = editingId
          ? savedList.map(it => it.savedAt === editingId ? item : it)
          : [item, ...savedList].slice(0, 100);
        setEditingId(now); // 저장 후에도 같은 ID 유지
        persist(next);
      };
      const loadItem = (item) => {
        restoreState(item);
        setEditingId(item.savedAt); // 불러온 항목 ID 기억 → 저장 시 덮어쓰기
        setShowSaved(false);
      };
      const deleteItem = (idx, e) => { e.stopPropagation(); persist(savedList.filter((_, i) => i !== idx)); };
      const shareUrl = () => {
        try {
          const enc = btoa(unescape(encodeURIComponent(JSON.stringify(collectState()))));
          navigator.clipboard.writeText(location.origin + location.pathname + "#" + enc);
          setCopiedLink(true); setTimeout(() => setCopiedLink(false), 2200);
        } catch {}
      };
      // URL hash 복원 (공유 링크) — 새 항목으로 처리
      useEffect(() => {
        const hash = location.hash.slice(1);
        if (!hash) return;
        try {
          restoreState(JSON.parse(decodeURIComponent(escape(atob(hash)))));
          setEditingId(null); // 공유 링크는 새 항목으로 저장
        } catch {}
      }, []);

      const C = useMemo(() => {
        const activeOption = options[activeOpt] || null;
        const rawBp = activeOption ? activeOption.bp : bp;

        const effRate =
          xrMode === "simple" ? nv(simRate)
          : cur === "CNY" ? nv(xrCny) : nv(xrUsd);
        const buyKrw = cur === "KRW" ? nv(rawBp) : nv(rawBp) * effRate;
        const customs   = simpleMode ? 0 : buyKrw * (nv(cr) / 100);
        const vatAmt    = simpleMode ? 0 : (vat ? (buyKrw + customs) * 0.1 : 0);
        const fwAmt     = simpleMode ? 0 : nv(fw);
        const clAmt     = simpleMode ? 0 : nv(cl);
        const impTotal  = buyKrw + customs + vatAmt + fwAmt + clAmt;
        const catFee    = CATS[ci].fee !== null ? CATS[ci].fee : nv(ccf);
        const promoActive = ch === "rocket" && promo !== "none";
        const baseLogistic = ch === "rocket"
          ? (RKTS[ri].fee !== null ? RKTS[ri].fee : nv(crf)) : nv(ms);
        const logistic  = (ch === "rocket" && promo === "90") ? 0 : baseLogistic;
        const varRate   = catFee / 100 + nv(ar) / 100 + (promoActive ? 0 : (nv(rr) / 100) * 0.3);
        const fixedC    = impTotal + logistic;

        // SP 결정: 활성 옵션 inputMode에 따라
        let SP;
        if (activeOption && activeOption.inputMode === "price") {
          SP = nv(activeOption.sp);
        } else if (activeOption && activeOption.inputMode === "margin") {
          const tgt = nv(activeOption.targetMargin);
          const denom = 1 - varRate - tgt / 100;
          SP = denom > 0.001 ? fixedC / denom : 0;
        } else {
          SP = nv(sp);
        }

        const commission = SP * (catFee / 100);
        const adCost    = SP * (nv(ar) / 100);
        const retCost   = promoActive ? 0 : SP * (nv(rr) / 100) * 0.3;
        const sellTotal = commission + logistic + adCost + retCost;

        // ── 부가세 계산 ──────────────────────────────────────────────────────
        // 일반과세자: 매출세액(SP/11) - 매입세액공제(수입부가세) = 순납부세액
        // 간이과세자: 도소매업 부가가치율 15% × 10% = SP × 1.5%
        // 면세/비과세: 0
        let outputVAT = 0, inputVATCredit = 0, vatBurden = 0;
        if (taxType === "general") {
          outputVAT     = SP / 11;                         // 매출세액
          inputVATCredit = vatAmt;                          // 수입부가세 매입세액공제
          vatBurden     = Math.max(0, outputVAT - inputVATCredit);
        } else if (taxType === "simple_tax") {
          outputVAT     = SP * 0.015;                      // 간이과세 도소매 1.5%
          inputVATCredit = 0;
          vatBurden     = outputVAT;
        }

        const totalCost = impTotal + sellTotal + vatBurden;
        const margin    = SP - totalCost;
        const marginRate = SP > 0 ? (margin / SP) * 100 : 0;

        // BEP/목표가: varRate에 부가세율도 반영
        const taxRate   = taxType === "general" ? (1/11) : taxType === "simple_tax" ? 0.015 : 0;
        const totalVarRate = varRate + taxRate;
        const bepPrice  = totalVarRate < 1 ? fixedC / (1 - totalVarRate) : 0;
        const tgtForMin = activeOption ? nv(activeOption.targetMargin) : nv(tm);
        const minPrice  = (totalVarRate + tgtForMin / 100) < 1
          ? fixedC / (1 - totalVarRate - tgtForMin / 100) : 0;
        return {
          SP, buyKrw, customs, vatAmt, fwAmt, clAmt, impTotal,
          catFee, commission, logistic, adCost, retCost, sellTotal,
          vatBurden, outputVAT, inputVATCredit,
          totalCost, margin, marginRate, bepPrice, minPrice, effRate,
          promoActive, fixedC, varRate,
        };
      }, [options, activeOpt, sp, bp, ch, ci, ccf, cur, xrMode, simRate, xrCny, xrUsd, simpleMode, cr, vat, fw, cl, ri, crf, promo, ms, ar, rr, tm, taxType]);

      const BARS = [
        { label: "수입원가", color: "#3B82F6", val: C.impTotal    },
        { label: "수수료",   color: "#C2703D", val: C.commission  },
        { label: "물류비",   color: "#F59E0B", val: C.logistic    },
        { label: "광고비",   color: "#8B5CF6", val: C.adCost      },
        { label: "반품비",   color: "#EC4899", val: C.retCost     },
        { label: "부가세",   color: "#0EA5E9", val: C.vatBurden   },
        { label: "이익",     color: mc(C.marginRate), val: Math.max(C.margin, 0) },
      ];

      return (
        <div className="mc-page" style={{ minHeight: "100vh", background: "#F6F3EC",
          color: "#1B2A3D", fontFamily: "'Noto Sans KR', sans-serif", padding: 20 }}>

          {/* MORIVA BRAND HEADER */}
          <div style={{ maxWidth: 1080, margin: "0 auto 20px", borderRadius: 14,
            overflow: "hidden", border: "1px solid #DCD5C3",
            boxShadow: "0 2px 8px rgba(20,20,10,0.06)" }}>
            <div className="mc-brand-inner" style={{ background: "#1B2A3D", padding: "20px 36px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 22, justifyContent: "center", flexWrap: "wrap" }}>
                {/* Mountain-M SVG Icon */}
                <svg width="72" height="60" viewBox="0 0 72 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                  {/* Left mountain */}
                  <polyline points="2,56 24,10 36,30 48,10 70,56"
                    fill="none" stroke="#FFFFFF" strokeWidth="6.5"
                    strokeLinejoin="miter" strokeLinecap="round"/>
                  {/* Inner V cut — creates the M notch */}
                  <polyline points="17,56 24,10 36,30 48,10 55,56"
                    fill="#1B2A3D" stroke="#1B2A3D" strokeWidth="1"/>
                  {/* Re-draw clean white strokes over notch */}
                  <line x1="2"  y1="56" x2="24" y2="10" stroke="#FFFFFF" strokeWidth="6.5" strokeLinecap="round"/>
                  <line x1="24" y1="10" x2="36" y2="30" stroke="#FFFFFF" strokeWidth="6.5" strokeLinecap="round"/>
                  <line x1="36" y1="30" x2="48" y2="10" stroke="#FFFFFF" strokeWidth="6.5" strokeLinecap="round"/>
                  <line x1="48" y1="10" x2="70" y2="56" stroke="#FFFFFF" strokeWidth="6.5" strokeLinecap="round"/>
                  {/* Gold diamond accent at top-center junction */}
                  <polygon points="36,2 41,12 36,22 31,12"
                    fill="#D98E3D"/>
                </svg>
                {/* Divider */}
                <div style={{ width: 1, height: 52, background: "#2A3A52" }} />
                {/* Text stack */}
                <div>
                  <div style={{ fontSize: 26, fontWeight: 900, color: "#FFFFFF",
                    letterSpacing: "0.12em", lineHeight: 1 }}>MORIVA</div>
                  <div style={{ fontSize: 13, fontWeight: 500, color: "#D98E3D",
                    letterSpacing: "0.18em", marginTop: 4 }}>모 리 바</div>
                  <div style={{ fontSize: 9.5, color: "#6B7E9B", letterSpacing: "0.22em",
                    marginTop: 5, textTransform: "uppercase" }}>Better Life, Better Move</div>
                </div>
              </div>
            </div>
            <div style={{ background: "#FFFDF8", padding: "12px 28px",
              display: "flex", justifyContent: "center", gap: 32, flexWrap: "wrap" }}>
              {[
                { e: "🏃", k: "ACTIVE", h: "액티브" },
                { e: "⛺", k: "CAMP",   h: "캠프"   },
                { e: "🏠", k: "HOME",   h: "홈"     },
                { e: "🐾", k: "PET",    h: "펫"     },
                { e: "👜", k: "BAG",    h: "백"     },
              ].map((c, i) => (
                <div key={i} style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 15 }}>{c.e}</div>
                  <div style={{ fontSize: 10, fontWeight: 700, color: "#1B2A3D", marginTop: 3 }}>{c.k}</div>
                  <div style={{ fontSize: 9, color: "#8B95A1" }}>{c.h}</div>
                </div>
              ))}
            </div>
          </div>

          {/* HEADER */}
          <div style={{ maxWidth: 1080, margin: "0 auto 20px" }}>
            <div className="mc-title-row" style={{ display: "flex", alignItems: "center" }}>
              <div>
                <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
                  <span style={{ fontSize: 20, fontWeight: 900, color: "#C2703D",
                    letterSpacing: "-0.02em" }}>COUPANG</span>
                  <span style={{ fontSize: 11, fontWeight: 700, color: "#8B95A1",
                    letterSpacing: "0.14em", textTransform: "uppercase" }}>
                    Gross Margin Calculator
                  </span>
                </div>
                <div style={{ fontSize: 11, color: "#8B95A1", marginTop: 2 }}>
                  중국 직소싱 상품 수익성 분석 · 수입원가 + 관부가세 + 판매비 자동 계산
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ padding: "6px 16px", borderRadius: 8,
                  background: mc(C.marginRate) + "12",
                  border: "1px solid " + mc(C.marginRate) + "30" }}>
                  <span style={{ fontSize: 24, fontFamily: "JetBrains Mono, monospace",
                    fontWeight: 900, color: mc(C.marginRate) }}>
                    {fp(C.marginRate)}%
                  </span>
                  <span style={{ fontSize: 12, color: mc(C.marginRate),
                    opacity: 0.7, marginLeft: 6 }}>마진율</span>
                </div>
              </div>
            </div>
            <div style={{ height: 1, marginTop: 12,
              background: "linear-gradient(90deg,#C2703D55,#C2703D18,transparent)" }} />
          </div>

          {/* TABS */}
          <div style={{ maxWidth: 1080, margin: "0 auto 16px", display: "flex", gap: 8 }}>
            {[["simple", "간편 계산"], ["customs", "통관 정밀 계산"]].map(([k, t]) => (
              <button key={k} onClick={() => setTab(k)}
                style={{ flex: 1, padding: "11px 14px", borderRadius: 10, cursor: "pointer",
                  fontFamily: "inherit", fontSize: 13.5, fontWeight: 800,
                  border: tab === k ? "none" : "1px solid #DCD5C3",
                  background: tab === k ? "#1B2A3D" : "#FFFDF8",
                  color: tab === k ? "#fff" : "#6B7684" }}>
                {t}
              </button>
            ))}
          </div>

          {tab === "customs" && (
            <CustomsTab regRef={customsRef} xrCny={xrMode === "simple" ? simRate : xrCny} xrUsd={xrUsd}
              onApply={(unitKrw, name) => {
                // 개당 원가에 세금·물류비가 이미 포함되어 있으므로
                // 간편 계산에서 관세·부가세·포워딩·통관비를 다시 더하지 않도록 0으로 맞춘다.
                setCur("KRW");
                setXrMode("manual");
                updateOpt(0, "bp", String(unitKrw));
                setCr("0"); setVat(false); setFw("0"); setCl("0");
                if (name) setPName(name);
                setTab("simple");
                window.scrollTo({ top: 0, behavior: "smooth" });
              }} />
          )}

          {/* MAIN GRID */}
          <div className="mc-main-grid" style={{ display: tab === "simple" ? "grid" : "none",
            maxWidth: 1080, margin: "0 auto",
            gap: 16, alignItems: "start" }}>

            {/* ──── LEFT: INPUTS ──── */}
            <div style={{ paddingRight: 2 }}>

              {/* 매입가 / 판매가 설정 카드 */}
              <Card>
                {(() => {
                  const opt = options[0];
                  const res = { sp: C.SP, marginRate: C.marginRate };
                  return (
                    <React.Fragment>
                      <NumIn label="① 매입가" unit={cur} value={opt.bp}
                        onChange={v => updateOpt(0,"bp",v)} placeholder="예: 15" />
                      <SL text="② 판매가 설정" />
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>

                  { t: `목표 ${fp(nv(tm))}% 최소가`, v: C.minPrice,
                    c: C.SP >= C.minPrice ? "#60A5FA" : "#FB923C",
                    s: C.SP >= C.minPrice ? "현재 판매가로 달성" : `${fmt(C.minPrice - C.SP)}원 인상 필요` },
                ].map((m, i) => (
                  <div key={i} style={{ background: "#FFFFFF", borderRadius: 10,
                    padding: "14px 16px", border: "1px solid " + m.c + "20" }}>
                    <div style={{ fontSize: 10, color: "#5F6B78", marginBottom: 6 }}>{m.t}</div>
                    <div style={{ fontSize: 18, fontFamily: "JetBrains Mono, monospace",
                      color: m.c, fontWeight: 700 }}>{fmt(m.v)}원</div>
                    <div style={{ fontSize: 10, color: "#5F6B78", marginTop: 4 }}>{m.s}</div>
                  </div>
                ))}
              </div>

              <Card>
                <PH>판매가 구성 분석 (100% 스택)</PH>
                <div style={{ display: "flex", height: 30, borderRadius: 6, overflow: "hidden", gap: 1 }}>
                  {BARS.filter(b => C.SP > 0 && b.val > 0).map((b, i) => (
                    <div key={i}
                      title={`${b.label}: ${fmt(b.val)}원 (${fp(b.val / C.SP * 100)}%)`}
                      style={{ background: b.color, height: "100%",
                        width: `${b.val / C.SP * 100}%`,
                        transition: "width .35s ease", flexShrink: 0 }} />
                  ))}
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 16px", marginTop: 10 }}>
                  {BARS.map((b, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                      <div style={{ width: 8, height: 8, borderRadius: 2,
                        background: b.color, flexShrink: 0 }} />
                      <span style={{ fontSize: 11, color: "#5F6B78" }}>{b.label}</span>
                      <span style={{ fontSize: 11, fontFamily: "JetBrains Mono, monospace", color: "#8B95A1" }}>
                        {C.SP > 0 ? fp(b.val / C.SP * 100) : "0.0"}%
                      </span>
                    </div>
                  ))}
                </div>
              </Card>

              <Card>
                <PH>비용 상세 내역</PH>
                <div style={{ fontSize: 11, color: "#3B82F6", fontWeight: 700, marginBottom: 8 }}>
                  📦 수입원가{simpleMode ? " · 간편비율 적용 중 (관세/부가세/배송비 포함됨)" : ""}
                </div>
                <CostRow label="  · 매입원가 (KRW 환산)" value={C.buyKrw} />
                <CostRow label={`  · 관세 (${cr}%)`}     value={C.customs} />
                <CostRow label="  · 수입부가세 (10%)"     value={C.vatAmt} />
                <CostRow label="  · 포워딩/국제배송비"    value={C.fwAmt} />
                <CostRow label="  · 통관비"              value={C.clAmt} />
                <CostRow label="수입원가 소계" value={C.impTotal} accent="#3B82F6" bold />
                <div style={{ height: 10 }} />
                <div style={{ fontSize: 11, color: "#C2703D", fontWeight: 700, marginBottom: 8 }}>
                  🛒 판매/운영비{C.promoActive ? ` · 로켓그로스 ${promo === "90" ? "첫 90일" : "+270일"} 혜택 적용 중` : ""}
                </div>
                <CostRow label={`  · 카테고리 수수료 (${fp(C.catFee)}%)`} value={C.commission} />
                <CostRow label={`  · ${ch === "rocket" ? "로켓그로스 물류비" : "마켓플레이스 배송비"}${promo === "90" ? " (혜택 0원)" : ""}`} value={C.logistic} />
                <CostRow label={`  · 광고비 (${ar}%)`}         value={C.adCost} />
                <CostRow label={`  · 반품비용 (${rr}% × 30%)${C.promoActive ? " (혜택 0원)" : ""}`} value={C.retCost} />
                <CostRow label="판매/운영비 소계" value={C.sellTotal} accent="#C2703D" bold />
                {taxType !== "exempt" && (
                  <React.Fragment>
                    <div style={{ fontSize: 11, color: "#0369A1", fontWeight: 700, marginBottom: 8, marginTop: 4 }}>
                      🧾 부가세 ({taxType === "general" ? "일반과세자" : "간이과세자"})
                    </div>
                    {taxType === "general" && (
                      <React.Fragment>
                        <CostRow label="  · 매출세액 (판매가÷11)" value={C.outputVAT} />
                        <CostRow label="  · 매입세액공제 (수입부가세)" value={-C.inputVATCredit} />
                      </React.Fragment>
                    )}
                    <CostRow label="  · 순 납부 부가세" value={C.vatBurden} accent="#0369A1" bold />
                  </React.Fragment>
                )}
                <div style={{ height: 8 }} />
                <CostRow label="총 비용" value={C.totalCost} accent="#8B95A1" bold />
                <div style={{ display: "flex", justifyContent: "space-between",
                  alignItems: "center", padding: "12px 0 4px",
                  borderTop: "1px solid #DCD5C3", marginTop: 8 }}>
                  <span style={{ fontSize: 15, fontWeight: 900, color: "#1B2A3D" }}>예상 마진</span>
                  <div style={{ textAlign: "right" }}>
                    <span style={{ fontSize: 19, fontWeight: 900,
                      fontFamily: "JetBrains Mono, monospace", color: mc(C.marginRate) }}>
                      {C.margin >= 0 ? "+" : ""}{fmt(C.margin)}원
                    </span>
                    <span style={{ marginLeft: 8, fontSize: 15,
                      fontFamily: "JetBrains Mono, monospace",
                      color: mc(C.marginRate), opacity: 0.75 }}>
                      ({fp(C.marginRate)}%)
                    </span>
                  </div>
                </div>
              </Card>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
<script src="./moriva-saves.js"></script>
<script src="./moriva-sync.js"></script>
</body>
</html>
