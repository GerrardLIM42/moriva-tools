<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

/* ======================================================================= */

const SUB_ROLE_LABEL = { front: "정면", side: "측면", package: "포장", component: "구성품", usage: "사용 장면", other: "기타" };

];

const STEP_LABELS = {
  benchmark: "1단계: 벤치마크 분석",
  product: "2단계: 내 제품 분석",
  strategy: "3단계: 상세페이지 전략 생성",

  factcheck: "5단계: 사실 검증",
};
const STEP_ORDER = ["benchmark", "product", "strategy", "sections", "factcheck"];

const RESULT_TABS = [
  { key: "benchmark", label: "벤치마크 분석 결과" },
  { key: "productFacts", label: "제품 사실정보" },
  { key: "strategy", label: "상세페이지 구성" },
  { key: "sections", label: "섹션별 프롬프트" },
  { key: "warnings", label: "확인 필요 정보 · 경고" },
];

/* 이 앱의 모든 AI 도구가 공유하는 전역 설정 키. 여기서 저장하면 다른 도구(상품명 생성기 등)에서도
   똑같이 적용된다 — 별도의 "AI 서비스 설정" 도구에서 한 번만 설정하면 된다. */
const LS_PROVIDER = "moriva_provider";
const LS_KEYS = "moriva_keys";
const LS_MODELS = "moriva_models";
const LS_RESULTS = "coupangStandalone.recentResults.v1";

function formatSaleOptions(options) {
  return (options || [])
    .filter((o) => (o.label && o.label.trim()) || (o.quantity && o.quantity.trim()))
    .map((o) => [o.label && o.label.trim(), o.quantity && o.quantity.trim()].filter(Boolean).join(" "))
    .join(", ");
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ======================================================================= */
/*  localStorage 헬퍼                                                       */
/* ======================================================================= */

/* AI 제공자별 설정 — 제공자마다 API 키와 마지막으로 고른 모델을 따로 기억한다. */
const DEFAULT_SETTINGS = {
  provider: "claude",
  keys: { claude: "", openai: "", gemini: "" },
  models: { claude: "claude-sonnet-5", openai: "gpt-5.4", gemini: "gemini-3.6-flash" },
};

function loadSettings() {
  try {
    const provider = localStorage.getItem(LS_PROVIDER);
    const keys = JSON.parse(localStorage.getItem(LS_KEYS) || "{}");
    const models = JSON.parse(localStorage.getItem(LS_MODELS) || "{}");
    return {
      provider: PROVIDERS[provider] ? provider : "claude",
      keys: {
        claude: keys.claude || "",
        openai: keys.openai || "",
        gemini: keys.gemini || "",
      },
      models: {
        claude: models.claude || DEFAULT_SETTINGS.models.claude,
        openai: models.openai || DEFAULT_SETTINGS.models.openai,
        gemini: models.gemini || DEFAULT_SETTINGS.models.gemini,
      },
    };
  } catch {
    return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  }
}
function saveSettings(settings) {
  try {
    localStorage.setItem(LS_PROVIDER, settings.provider);
    localStorage.setItem(LS_KEYS, JSON.stringify(settings.keys));
    localStorage.setItem(LS_MODELS, JSON.stringify(settings.models));
  } catch {}
}
function loadRecentResults() {
  try {
    const raw = localStorage.getItem(LS_RESULTS);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}
function saveRecentResult(result) {
  const existing = loadRecentResults().filter((r) => r.id !== result.id);
  const updated = [result, ...existing].slice(0, 10);
  try {
    localStorage.setItem(LS_RESULTS, JSON.stringify(updated));
  } catch {}
  return updated;
}
function deleteRecentResult(id) {
  const updated = loadRecentResults().filter((r) => r.id !== id);
  localStorage.setItem(LS_RESULTS, JSON.stringify(updated));
  return updated;
}

function maskKey(key) {
  const t = (key || "").trim();
  if (t.length <= 4) return "••••";
  return "••••" + t.slice(-4);
}

/* ======================================================================= */
/*  이미지 전처리 (Canvas 기반)                                               */
/* ======================================================================= */

const ALLOWED_TYPES = ["image/png", "image/jpeg", "image/webp"];
const MAX_FILE_BYTES = 20 * 1024 * 1024;
const MAX_WIDTH = 2200;
const SPLIT_CHUNK = 1600;
const SPLIT_OVERLAP = 120;

function validateFileClientSide(file) {
  if (!ALLOWED_TYPES.includes(file.type)) {
    return `${file.name}: PNG, JPG, JPEG, WebP 파일만 업로드할 수 있습니다.`;
  }
  if (file.size > MAX_FILE_BYTES) {
    return `${file.name}: 파일 용량이 너무 큽니다 (최대 20MB).`;
  }
  return null;
}

function computeSplitRanges(totalHeight) {
  if (totalHeight <= SPLIT_CHUNK) return [{ top: 0, height: totalHeight }];
  const step = SPLIT_CHUNK - SPLIT_OVERLAP;
  const ranges = [];
  let top = 0;
  for (;;) {
    const height = Math.min(SPLIT_CHUNK, totalHeight - top);
    ranges.push({ top, height });
    if (top + height >= totalHeight) break;
    top += step;
  }
  return ranges;
}

/** 파일 하나를 처리해 ProcessedImage 배열로 반환한다 (EXIF 회전 보정 + 리사이즈 + 분할, 전부 브라우저 메모리에서만). */
async function processImageFile(file, role, subRole, order) {
  const clientError = validateFileClientSide(file);
  if (clientError) throw new Error(clientError);

  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
  } catch {
    throw new Error(`${file.name}: 손상되었거나 읽을 수 없는 이미지 파일입니다.`);
  }

  const scale = Math.min(1, MAX_WIDTH / bitmap.width);
  const width = Math.max(1, Math.round(bitmap.width * scale));
  const height = Math.max(1, Math.round(bitmap.height * scale));

  const baseCanvas = document.createElement("canvas");
  baseCanvas.width = width;
  baseCanvas.height = height;
  baseCanvas.getContext("2d").drawImage(bitmap, 0, 0, width, height);

  const ranges = computeSplitRanges(height);
  const rolePrefix = role === "benchmark" ? "benchmark" : "product";
  const orderLabel = String(order).padStart(2, "0");
  const mediaType = "image/jpeg";

  const results = [];
  for (let i = 0; i < ranges.length; i++) {
    const r = ranges[i];
    const isSplit = ranges.length > 1;
    const label = isSplit
      ? `${rolePrefix}-${orderLabel}-part-${String(i + 1).padStart(2, "0")}`
      : `${rolePrefix}-${orderLabel}`;

    let base64;
    if (isSplit) {
      const chunk = document.createElement("canvas");
      chunk.width = width;
      chunk.height = r.height;
      chunk.getContext("2d").drawImage(baseCanvas, 0, r.top, width, r.height, 0, 0, width, r.height);
      base64 = chunk.toDataURL(mediaType, 0.9).split(",")[1];
    } else {
      base64 = baseCanvas.toDataURL(mediaType, 0.9).split(",")[1];
    }
    results.push({ label, role, subRole, mediaType, base64, width, height: r.height, originalFileName: file.name, sourceOrder: order });
  }
  return results;
}

async function processImageList(items, role) {
  const all = [];
  const errors = [];
  for (const item of items) {
    try {
      const processed = await processImageFile(item.file, role, item.subRole, item.order);
      all.push(...processed);
    } catch (e) {
      errors.push(e.message || String(e));
    }
  }
  return { images: all, errors };
}

function checkRequired(obj, requiredKeys) {
  const missing = [];
  if (!obj || typeof obj !== "object") return requiredKeys.slice();
  for (const key of requiredKeys) {
    if (obj[key] === undefined || obj[key] === null) missing.push(key);
  }
  return missing;
}

function imagesToBlocks(images) {
  return images.flatMap((img) => [
    { type: "text", text: `[이미지 라벨: ${img.label}]` },
    { type: "image", mediaType: img.mediaType, base64: img.base64 },
  ]);
}

function toAnthropicContent(blocks) {
  return blocks.map((b) =>
    b.type === "text"
      ? { type: "text", text: b.text }
      : { type: "image", source: { type: "base64", media_type: b.mediaType, data: b.base64 } }
  );
}

function toOpenAIContent(blocks) {
  return blocks.map((b) =>
    b.type === "text"
      ? { type: "text", text: b.text }
      : { type: "image_url", image_url: { url: `data:${b.mediaType};base64,${b.base64}` } }
  );
}

function toGeminiParts(blocks) {
  return blocks.map((b) =>
    b.type === "text" ? { text: b.text } : { inline_data: { mime_type: b.mediaType, data: b.base64 } }
  );
}

/** Claude(Anthropic)에게 도구 호출을 강제해 구조화된 JSON을 받는다. */
async function callClaudeTool({ apiKey, model, system, userContent, tool, maxTokens }) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model,
      max_tokens: maxTokens || 8000,
      system,
      tools: [tool],
      tool_choice: { type: "tool", name: tool.name },
      messages: [{ role: "user", content: toAnthropicContent(userContent) }],
    }),
  });
  let json;
  try { json = await res.json(); } catch { throw new Error(`Claude API 응답을 해석할 수 없습니다 (HTTP ${res.status}).`); }
  if (!res.ok) throw new Error(`Claude API 호출 중 오류: ${(json && json.error && json.error.message) || res.status}`);
  const toolUse = (json.content || []).find((b) => b.type === "tool_use" && b.name === tool.name);
  if (!toolUse) throw new Error("Claude 응답에 도구 호출이 포함되지 않았습니다.");
  return toolUse.input;
}

/** ChatGPT(OpenAI)에게 함수 호출을 강제해 구조화된 JSON을 받는다. */
async function callOpenAITool({ apiKey, model, system, userContent, tool, maxTokens }) {
  let res;
  try {
    res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey}` },
      body: JSON.stringify({
        model,
        max_tokens: maxTokens || 8000,
        messages: [
          { role: "system", content: system },
          { role: "user", content: toOpenAIContent(userContent) },
        ],
        tools: [{ type: "function", function: { name: tool.name, description: tool.description, parameters: tool.input_schema } }],
        tool_choice: { type: "function", function: { name: tool.name } },
      }),
    });
  } catch (e) {
    throw new Error("ChatGPT API 호출에 실패했습니다. 브라우저에서 OpenAI API로의 직접 호출이 네트워크/보안 정책으로 차단되었을 수 있습니다 (CORS). 이 경우 Claude 또는 Gemini를 사용해주세요.");
  }
  let json;
  try { json = await res.json(); } catch { throw new Error(`ChatGPT API 응답을 해석할 수 없습니다 (HTTP ${res.status}).`); }
  if (!res.ok || json.error) throw new Error(`ChatGPT API 호출 중 오류: ${(json.error && json.error.message) || res.status}`);
  const msg = json.choices && json.choices[0] && json.choices[0].message;
  const call = msg && msg.tool_calls && msg.tool_calls[0];
  if (!call) throw new Error("ChatGPT 응답에 도구 호출이 포함되지 않았습니다.");
  try {
    return JSON.parse(call.function.arguments);
  } catch {
    throw new Error("ChatGPT 응답을 구조화된 데이터로 해석할 수 없습니다.");
  }
}

/** Gemini(Google)에게 함수 호출을 강제해 구조화된 JSON을 받는다. */
async function callGeminiTool({ apiKey, model, system, userContent, tool, maxTokens }) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: toGeminiParts(userContent) }],
      systemInstruction: { parts: [{ text: system }] },
      tools: [{ functionDeclarations: [{ name: tool.name, description: tool.description, parameters: tool.input_schema }] }],
      toolConfig: { functionCallingConfig: { mode: "ANY", allowedFunctionNames: [tool.name] } },
      generationConfig: { maxOutputTokens: maxTokens || 8000, temperature: 0.4 },
    }),
  });
  let json;
  try { json = await res.json(); } catch { throw new Error(`Gemini API 응답을 해석할 수 없습니다 (HTTP ${res.status}).`); }
  if (json.error) throw new Error(`Gemini API 호출 중 오류: ${json.error.message || "알 수 없는 오류"}`);
  const cand = json.candidates && json.candidates[0];
  const part = cand && cand.content && (cand.content.parts || []).find((p) => p.functionCall);
  if (!part) throw new Error("Gemini 응답에 도구 호출이 포함되지 않았습니다.");
  return part.functionCall.args;
}

async function callProviderTool(params) {
  if (params.provider === "openai") return callOpenAITool(params);
  if (params.provider === "gemini") return callGeminiTool(params);
  return callClaudeTool(params);
}

/** 제공자에 상관없이 동일하게: 첫 시도에서 필드가 누락되면 한 번 더 채워서 제출하도록 재시도한다. */
async function runStructuredStep({ provider, apiKey, model, system, userContent, tool, requiredKeys, maxTokens }) {
  let missingFields = "";
  for (let attempt = 0; attempt < 2; attempt++) {
    const attemptSystem = attempt === 0
      ? system
      : `${system}\n\n[재시도] 이전 제출에서 다음 필드가 비어 있었습니다: ${missingFields}. 반드시 ${tool.name} 도구를 호출해 스키마의 모든 필드를 빠짐없이 채워 다시 제출하세요.`;
    let result;
    try {
      result = await callProviderTool({ provider, apiKey, model, system: attemptSystem, userContent, tool, maxTokens });
    } catch (e) {
      if (attempt === 1) throw e;
      missingFields = "전체 필드 (이전 호출 실패: " + (e.message || e) + ")";
      continue;
    }
    const missing = checkRequired(result, requiredKeys);
    if (missing.length === 0) return result;
    if (attempt === 1) {
      throw new Error(`AI 응답이 예상한 데이터 형식과 일치하지 않습니다 (누락: ${missing.join(", ")}). 잠시 후 다시 시도해주세요.`);
    }
    missingFields = missing.join(", ");
  }
}

function sectionToMarkdown(s) {
  return `### ${s.sectionNumber}. ${s.sectionType}

**헤드라인**: ${s.headline}
**서브헤드라인**: ${s.subheadline}

**본문 카피**
${s.bodyCopy}

**증거/근거**: ${s.proofOrEvidence}
**근거 출처**: ${s.sourceFact}

**비주얼 구성**: ${s.visualComposition}
**제품 위치**: ${s.productPosition}
**배경**: ${s.background}
**조명**: ${s.lighting}
**색상 팔레트**: ${s.colorPalette}
**타이포그래피 방향**: ${s.typographyDirection}
**텍스트 안전영역**: ${s.textSafeArea}
**크기**: 폭 ${s.width}px / 권장 높이 ${s.recommendedHeight}px

**한글 이미지 프롬프트**
${s.koreanImagePrompt}

**영어 이미지 프롬프트**
${s.englishImagePrompt}

**한글 텍스트 미포함 버전 프롬프트**
${s.noTextImagePrompt}

**네거티브 프롬프트**
${s.negativePrompt}
${s.warnings && s.warnings.length > 0 ? `\n**주의사항**\n${s.warnings.map((w) => `- ${w}`).join("\n")}` : ""}`;
}

function resultToMarkdown(result) {
  const parts = [];
  parts.push(`# 쿠팡 상세페이지 프롬프트: ${result.productFacts.productName || "제품명 미입력"}`);
  parts.push(`생성일: ${new Date(result.createdAt).toLocaleString("ko-KR")} · 분석 모드: ${result.mode === "quick" ? "빠른 분석" : "정밀 분석"}`);
  if (result.strategy) {
    parts.push(`## 상세페이지 전략

- 핵심 타깃: ${result.strategy.coreTarget}
- 고객의 문제: ${result.strategy.customerProblem}
- 제품의 해결 방식: ${result.strategy.productSolution}
- 경쟁 제품과 구분되는 점: ${result.strategy.differentiation}
- 핵심 구매 이유: ${result.strategy.keyReasonsToBuy.join(", ")}
- 스토리 순서: ${result.strategy.storyFlow.join(" → ")}`);
  }
  if (result.sections.length > 0) {
    parts.push(`## 섹션별 카피 및 이미지 프롬프트\n`);
    parts.push(result.sections.map(sectionToMarkdown).join("\n\n---\n\n"));
  }
  if (result.factCheckIssues.length > 0) {
    parts.push(`## 사실 검증 경고

${result.factCheckIssues.map((i) => `- [${i.sectionNumber === 0 ? "전체" : `섹션 ${i.sectionNumber}`}] ${i.description} → ${i.recommendation}`).join("\n")}`);
  }
  return parts.join("\n\n");
}

function resultToJson(result) {
  return JSON.stringify(result, null, 2);
}

function buildSharedDesignSystem(result) {
  const first = result.sections[0];
  return [
    `- 브랜드 색상: ${result.productFacts.brandColor || (first && first.colorPalette) || "미지정 - 섹션 1의 색상 팔레트를 기준으로 전 섹션 통일"}`,
    `- 원하는 분위기: ${result.productFacts.desiredMood || "차분하고 신뢰감 있는 커머셜 톤"}`,
    `- 기준 색상 팔레트: ${(first && first.colorPalette) || "섹션 1의 색상 팔레트를 전 섹션에 동일하게 적용"}`,
    `- 기준 타이포그래피 방향: ${(first && first.typographyDirection) || "섹션 1의 타이포그래피 방향을 전 섹션에 동일하게 적용"}`,
    `- 카피 톤: ${(result.benchmarkAnalysis && result.benchmarkAnalysis.copyLengthAndTone) || "짧고 명확한 모바일 친화적 톤"}`,
  ].join("\n");
}

function sectionToMasterPromptBlock(s, total) {

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch {
    return false;
  }
}

function downloadTextFile(fileName, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function ImageUploader({ title, description, roleBadgeLabel, roleBadgeClass, items, setItems, showSubRole }) {
  const [dragOver, setDragOver] = useState(false);
  const dragIndexRef = useRef(null);
  const inputRef = useRef(null);

  const addFiles = (fileList) => {
    const files = Array.from(fileList || []);
    if (files.length === 0) return;
    const newItems = files.map((file) => ({ id: uid(), file, previewUrl: URL.createObjectURL(file), originalFileName: file.name, subRole: "other" }));
    setItems((prev) => [...prev, ...newItems]);
  };

  const removeItem = (id) => {
    setItems((prev) => {
      const target = prev.find((i) => i.id === id);
      if (target) URL.revokeObjectURL(target.previewUrl);
      return prev.filter((i) => i.id !== id);
    });
  };
  const move = (from, to) => {
    setItems((prev) => {
      if (to < 0 || to >= prev.length || from === to) return prev;
      const copy = [...prev];
      const [moved] = copy.splice(from, 1);
      copy.splice(to, 0, moved);
      return copy;
    });
  };
  const setSubRole = (id, subRole) => setItems((prev) => prev.map((i) => (i.id === id ? { ...i, subRole } : i)));

  return (
    <div className="card">
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
        <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--navy-900)" }}>{title}</h3>
        <span className={"badge " + roleBadgeClass}>{roleBadgeLabel}</span>
      </div>
      <p className="hint" style={{ marginBottom: 14 }}>{description}</p>
      <div
        className={"dropzone" + (dragOver ? " drag-over" : "")}
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={(e) => { e.preventDefault(); setDragOver(false); addFiles(e.dataTransfer.files); }}
        onClick={() => inputRef.current && inputRef.current.click()}
      >
        <p>이미지를 드래그해서 놓거나 클릭해서 선택하세요</p>
        <p className="small">PNG, JPG, JPEG, WebP · 여러 장 선택 가능</p>
        <input ref={inputRef} type="file" multiple accept="image/png,image/jpeg,image/webp" style={{ display: "none" }}
          onChange={(e) => { addFiles(e.target.files); e.target.value = ""; }} />
      </div>
      {items.length > 0 && (
        <div className="thumb-grid">
          {items.map((item, index) => (
            <div key={item.id} className="thumb" draggable
              onDragStart={() => { dragIndexRef.current = index; }}
              onDragOver={(e) => e.preventDefault()}
              onDrop={(e) => { e.preventDefault(); if (dragIndexRef.current !== null) { move(dragIndexRef.current, index); dragIndexRef.current = null; } }}>
              <div className="thumb-image-wrap">
                <img src={item.previewUrl} alt={item.originalFileName} />
                <span className="thumb-order">#{index + 1}</span>
                <button type="button" className="thumb-remove" onClick={() => removeItem(item.id)} aria-label="삭제">×</button>
              </div>
              <div className="thumb-controls">
                <button type="button" onClick={() => move(index, index - 1)} disabled={index === 0}>▲</button>
                <span className="thumb-name" title={item.originalFileName}>{item.originalFileName}</span>
                <button type="button" onClick={() => move(index, index + 1)} disabled={index === items.length - 1}>▼</button>
              </div>
              {showSubRole && (
                <select value={item.subRole} onChange={(e) => setSubRole(item.id, e.target.value)}>
                  {Object.entries(SUB_ROLE_LABEL).map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                </select>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ProductFactsForm({ value, onChange, productImages, provider, apiKey, model }) {
  const [autoLoading, setAutoLoading] = useState(false);
  const [autoNotice, setAutoNotice] = useState("");
  const [autoError, setAutoError] = useState("");
  const [reviewText, setReviewText] = useState("");
  const [reviewLoading, setReviewLoading] = useState(false);
  const [reviewError, setReviewError] = useState("");

  const setField = (key, v) => onChange({ ...value, [key]: v });

  const handleAutoFill = async () => {
    if (productImages.length === 0) return;
    if (!apiKey) { setAutoError("먼저 상단 'API 키 설정'에서 API 키를 저장해주세요."); return; }
    setAutoLoading(true);
    setAutoError("");
    setAutoNotice("");
    try {
      const { images, errors } = await processImageList(
        productImages.map((it, idx) => ({ file: it.file, order: idx + 1, subRole: it.subRole })),
        "product"
      );
      if (errors.length > 0) throw new Error(errors.join("\n"));
      const labels = images.map((i) => i.label);
      const p = extractProductFactsFromImagesPrompt(labels);
      const extracted = await runStructuredStep({
        provider, apiKey, model, system: p.system,
        userContent: [{ type: "text", text: p.instructionText }, ...imagesToBlocks(images)],
        tool: EXTRACT_TOOL, requiredKeys: EXTRACT_TOOL.input_schema.required, maxTokens: 2000,
      });
      const next = { ...value };
      let filled = 0;
      Object.keys(extracted).forEach((key) => {
        if (extracted[key] && !value[key]) { next[key] = extracted[key]; filled++; }
      });
      onChange(next);
      setAutoNotice(filled > 0 ? `이미지에서 확인된 정보로 ${filled}개 항목을 채웠습니다.` : "이미지에서 명확히 확인되는 새 정보가 없었습니다.");
    } catch (e) {
      setAutoError(e.message || "자동 추출에 실패했습니다.");
    } finally {
      setAutoLoading(false);
    }
  };

  const setSaleOptions = (opts) => onChange({ ...value, saleOptions: opts });
  const addSaleOption = () => setSaleOptions([...(value.saleOptions || []), { label: "", quantity: "" }]);
  const updateSaleOption = (idx, patch) => setSaleOptions(value.saleOptions.map((o, i) => (i === idx ? { ...o, ...patch } : o)));
  const removeSaleOption = (idx) => setSaleOptions(value.saleOptions.filter((_, i) => i !== idx));

  const handleReviewExtract = async () => {
    if (!reviewText.trim()) return;
    if (!apiKey) { setReviewError("먼저 상단 'API 키 설정'에서 API 키를 저장해주세요."); return; }
    setReviewLoading(true);
    setReviewError("");
    try {
      const p = extractReviewInsightsPrompt(reviewText);
      const insights = await runStructuredStep({
        provider, apiKey, model, system: p.system, userContent: [{ type: "text", text: p.instructionText }],
        tool: REVIEW_TOOL, requiredKeys: REVIEW_TOOL.input_schema.required, maxTokens: 2000,
      });
      if (!insights.painPoints || insights.painPoints.length === 0) {
        setReviewError("리뷰에서 뚜렷한 불편사항을 찾지 못했습니다.");
        return;
      }
      const existing = value.customerPainPoint.split("\n").map((l) => l.trim()).filter(Boolean);
      const newLines = insights.painPoints.filter((p) => !existing.includes(p.trim()));
      setField("customerPainPoint", [...existing, ...newLines].join("\n"));
    } catch (e) {
      setReviewError(e.message || "리뷰 분석에 실패했습니다.");
    } finally {
      setReviewLoading(false);
    }
  };

  return (
    <div className="card">
      <div style={{ display: "flex", flexWrap: "wrap", alignItems: "flex-start", justifyContent: "space-between", gap: 8, marginBottom: 4 }}>
        <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--navy-900)" }}>제품 사실정보 입력</h3>
        <button type="button" className="btn" onClick={handleAutoFill} disabled={productImages.length === 0 || autoLoading}>
          {autoLoading ? "이미지 분석 중…" : "제품 이미지에서 자동으로 가져오기"}
        </button>
      </div>
      <p className="hint" style={{ marginBottom: 8 }}>여기 입력하지 않았거나 이미지에서 확인되지 않은 인증·수치·소재·기능은 카피에 사용되지 않습니다.</p>
      {autoNotice && <p className="hint" style={{ color: "var(--navy-600)" }}>{autoNotice}</p>}
      {autoError && <p className="hint" style={{ color: "#dc2626" }}>{autoError}</p>}

      <div className="field-grid" style={{ marginTop: 12 }}>
        {FACTS_FIELDS.map((field) => (
          <div key={field.key} className={field.multiline ? "col-span-2" : ""}>
            <label className="field-label">{field.label}</label>
            {field.multiline
              ? <textarea rows={2} value={value[field.key]} onChange={(e) => setField(field.key, e.target.value)} />
              : <input type="text" value={value[field.key]} onChange={(e) => setField(field.key, e.target.value)} />}

            {field.key === "packageComposition" && (
              <div className="inline-box">
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                  <span style={{ fontSize: 12, fontWeight: 600, color: "var(--navy-600)" }}>판매 옵션 (색상/구성별 수량 — 선택사항)</span>
                  <button type="button" className="btn" style={{ padding: "4px 10px", fontSize: 12 }} onClick={addSaleOption}>+ 옵션 추가</button>
                </div>
                {(!value.saleOptions || value.saleOptions.length === 0) ? (
                  <p className="hint">예: 블랙 10개, 화이트 10개, 혼합 10개처럼 옵션별로 나눠서 입력할 수 있습니다.</p>
                ) : (
                  value.saleOptions.map((opt, idx) => (
                    <div key={idx} className="opt-row">
                      <input type="text" value={opt.label} onChange={(e) => updateSaleOption(idx, { label: e.target.value })} placeholder="예: 블랙" />
                      <input type="text" value={opt.quantity} onChange={(e) => updateSaleOption(idx, { quantity: e.target.value })} placeholder="예: 10개" style={{ maxWidth: 120 }} />
                      <button type="button" className="btn" style={{ padding: "6px 10px", fontSize: 12 }} onClick={() => removeSaleOption(idx)}>삭제</button>
                    </div>
                  ))
                )}
              </div>
            )}

            {field.key === "customerPainPoint" && (
              <div className="inline-box">
                <span style={{ fontSize: 12, fontWeight: 600, color: "var(--navy-600)", display: "block", marginBottom: 8 }}>
                  고객 리뷰 붙여넣기 (선택사항) — 불편사항을 자동으로 뽑아서 위 항목에 채워줍니다
                </span>
                <textarea rows={3} value={reviewText} onChange={(e) => setReviewText(e.target.value)} placeholder="쿠팡/네이버 등에서 복사한 리뷰 원문을 여기에 붙여넣으세요." style={{ marginBottom: 8 }} />
                <button type="button" className="btn" onClick={handleReviewExtract} disabled={!reviewText.trim() || reviewLoading}>
                  {reviewLoading ? "리뷰 분석 중…" : "리뷰에서 불편사항 추출"}
                </button>
                {reviewError && <p className="hint" style={{ color: "#dc2626" }}>{reviewError}</p>}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

          <div className="prompt-box">
            <h5>이미지 생성 프롬프트</h5>
            <Field label="한글 프롬프트" k="koreanImagePrompt" rows={3} />
            <Field label="영어 프롬프트" k="englishImagePrompt" rows={3} />
            <Field label="한글 텍스트 미포함 버전" k="noTextImagePrompt" rows={3} />
            <Field label="네거티브 프롬프트" k="negativePrompt" rows={2} />
          </div>
        </div>
      )}
    </div>
  );
}

function SectionsTab({ sections, onChangeSections }) {
  const dragIndexRef = useRef(null);
  if (sections.length === 0) return <EmptyState message="섹션별 결과가 아직 없습니다." />;
  const renumber = (list) => list.map((s, i) => ({ ...s, sectionNumber: i + 1 }));
  const move = (from, to) => {
    if (to < 0 || to >= sections.length || from === to) return;
    const next = [...sections];
    const [moved] = next.splice(from, 1);
    next.splice(to, 0, moved);
    onChangeSections(renumber(next));
  };
  return (
    <div>
      {sections.map((s, index) => (
        <SectionCard key={index} section={s} index={index} total={sections.length}
          onChange={(updated) => { const next = [...sections]; next[index] = updated; onChangeSections(next); }}
          onMoveUp={() => move(index, index - 1)} onMoveDown={() => move(index, index + 1)}
          onDragStart={() => { dragIndexRef.current = index; }}
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => { e.preventDefault(); if (dragIndexRef.current !== null) { move(dragIndexRef.current, index); dragIndexRef.current = null; } }} />
      ))}
    </div>
  );
}

function WarningsTab({ productAnalysis, factCheckIssues }) {
  if (!productAnalysis && factCheckIssues.length === 0) return <EmptyState message="확인 필요 정보와 경고가 아직 없습니다." />;
  const ISSUE_LABEL = {
    unsupported_feature: "근거 없는 기능", quantity_mismatch: "구성 수량 불일치", color_or_shape_mismatch: "색상/형태 불일치",
    unsupported_certification_or_number: "근거 없는 인증/수치/비교우위", competitor_brand_or_copy_remnant: "경쟁사 브랜드/고유 카피 잔존",
    duplicated_content: "내용 중복", mobile_text_too_small: "모바일 글자 크기 위험", other: "기타",
  };
  return (
    <div className="stack">
      {productAnalysis && (
        <>
          <div className="warn-box"><h4 className="section-title">이미지에서 추정되지만 확인되지 않은 내용</h4><ul className="plain-list">{productAnalysis.inferredUnconfirmed.map((it, i) => <li key={i}>{it}</li>)}</ul></div>
          <div className="warn-box"><h4 className="section-title">서로 충돌하는 정보</h4><ul className="plain-list">{productAnalysis.conflictingInfo.map((it, i) => <li key={i}>{it}</li>)}</ul></div>
          <div className="warn-box"><h4 className="section-title">추가 확인이 필요한 정보</h4><ul className="plain-list">{productAnalysis.needsVerification.map((it, i) => <li key={i}>{it}</li>)}</ul></div>
          <div className="danger-box"><h4 className="section-title">상세페이지에서 사용하면 안 되는 주장</h4><ul className="plain-list">{productAnalysis.forbiddenClaims.map((it, i) => <li key={i}>{it}</li>)}</ul></div>
        </>
      )}
      <div className="card">
        <h4 className="section-title">5단계 사실 검증 결과 {factCheckIssues.length > 0 && <span className="badge badge-red">{factCheckIssues.length}건 발견</span>}</h4>
        {factCheckIssues.length === 0 ? <p className="hint">발견된 문제가 없습니다.</p> : factCheckIssues.map((issue, i) => (
          <div key={i} style={{ padding: "10px 0", borderTop: "1px solid var(--navy-100)", fontSize: 13 }}>
            <div style={{ marginBottom: 4 }}>
              <span className="badge badge-red" style={{ background: "#fee2e2", color: "#b91c1c" }}>{ISSUE_LABEL[issue.issueType] || issue.issueType}</span>{" "}
              <span className="hint" style={{ display: "inline" }}>{issue.sectionNumber === 0 ? "전체" : `섹션 ${issue.sectionNumber}`}</span>
            </div>
            <p style={{ margin: 0 }}>{issue.description}</p>
            <p style={{ margin: "4px 0 0", color: "var(--navy-500)" }}>→ {issue.recommendation}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ======================================================================= */
/*  App 루트                                                                */
/* ======================================================================= */

function initialSteps() {
  return STEP_ORDER.map((key) => ({ key, label: STEP_LABELS[key], status: "idle" }));
}

function App() {
  const [settings, setSettings] = useState(() => loadSettings());
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [mode, setMode] = useState("quick");
  const [facts, setFacts] = useState(EMPTY_FACTS);
  const [activeTab, setActiveTab] = useState("benchmark");
  const [recentResults, setRecentResults] = useState(() => loadRecentResults());
  const [resultId, setResultId] = useState(null);
  const [resultCreatedAt, setResultCreatedAt] = useState(null);
  const [notice, setNotice] = useState("");

  const [benchmarkImages, setBenchmarkImages] = useState([]);
  const [productImages, setProductImages] = useState([]);

  const [steps, setSteps] = useState(initialSteps());
  const [isRunning, setIsRunning] = useState(false);
  const [pipelineError, setPipelineError] = useState("");
  const [benchmarkAnalysis, setBenchmarkAnalysis] = useState(null);
  const [productAnalysis, setProductAnalysis] = useState(null);
  const [strategy, setStrategy] = useState(null);
  const [sections, setSections] = useState([]);
  const [factCheckIssues, setFactCheckIssues] = useState([]);

  useEffect(() => { saveSettings(settings); }, [settings]);
  useEffect(() => { if (!notice) return; const t = setTimeout(() => setNotice(""), 5000); return () => clearTimeout(t); }, [notice]);

  const updateStep = (key, patch) => setSteps((prev) => prev.map((s) => (s.key === key ? { ...s, ...patch } : s)));

  const provider = settings.provider || "claude";
  const apiKey = settings.keys[provider] || "";
  const model = settings.models[provider] || PROVIDERS[provider].models[0].id;

  const canAnalyze = !isRunning && benchmarkImages.length > 0 && productImages.length > 0 && facts.productName.trim().length > 0 && !!apiKey;

  const handleAnalyze = async () => {
    if (!apiKey) { setSettingsOpen(true); setPipelineError("먼저 API 키를 저장해주세요."); return; }
    setIsRunning(true);
    setPipelineError("");
    setSteps(initialSteps());
    setBenchmarkAnalysis(null);
    setProductAnalysis(null);
    setStrategy(null);
    setSections([]);
    setFactCheckIssues([]);
    const id = uid();
    const createdAt = new Date().toISOString();
    setResultId(id);
    setResultCreatedAt(createdAt);
    setActiveTab("benchmark");

    try {
      updateStep("benchmark", { status: "running" });
      const { images: benchProcessed, errors: benchErrors } = await processImageList(
        benchmarkImages.map((it, idx) => ({ file: it.file, order: idx + 1 })), "benchmark"
      );
      if (benchErrors.length > 0) throw new Error(benchErrors.join("\n"));
      const benchLabels = benchProcessed.map((i) => i.label);
      const bp = benchmarkAnalysisPrompt(mode, benchLabels);
      const benchmark = await runStructuredStep({
        provider, apiKey, model, system: bp.system,
        userContent: [{ type: "text", text: bp.instructionText }, ...imagesToBlocks(benchProcessed)],
        tool: BENCHMARK_TOOL, requiredKeys: BENCHMARK_TOOL.input_schema.required, maxTokens: mode === "quick" ? 4000 : 6000,
      });
      setBenchmarkAnalysis(benchmark);
      updateStep("benchmark", { status: "done" });

      updateStep("product", { status: "running" });
      const { images: prodProcessed, errors: prodErrors } = await processImageList(
        productImages.map((it, idx) => ({ file: it.file, order: idx + 1, subRole: it.subRole })), "product"
      );
      if (prodErrors.length > 0) throw new Error(prodErrors.join("\n"));
      const prodLabels = prodProcessed.map((i) => i.label);
      const pp = productAnalysisPrompt(mode, facts, prodLabels);
      const product = await runStructuredStep({
        provider, apiKey, model, system: pp.system,
        userContent: [{ type: "text", text: pp.instructionText }, ...imagesToBlocks(prodProcessed)],
        tool: PRODUCT_TOOL, requiredKeys: PRODUCT_TOOL.input_schema.required, maxTokens: mode === "quick" ? 4000 : 6000,
      });
      setProductAnalysis(product);
      updateStep("product", { status: "done" });

      updateStep("strategy", { status: "running" });
      const sp = strategyPrompt(mode, facts, benchmark, product);
      const strategyResult = await runStructuredStep({
        provider, apiKey, model, system: sp.system, userContent: [{ type: "text", text: sp.instructionText }],
        tool: STRATEGY_TOOL, requiredKeys: STRATEGY_TOOL.input_schema.required, maxTokens: mode === "quick" ? 4000 : 6000,
      });
      setStrategy(strategyResult);
      updateStep("strategy", { status: "done" });

      updateStep("sections", { status: "running" });
      const secp = sectionsPrompt(mode, facts, benchmark, product, strategyResult, prodLabels);
      const sectionsResult = await runStructuredStep({
        provider, apiKey, model, system: secp.system,
        userContent: [{ type: "text", text: secp.instructionText }, ...imagesToBlocks(prodProcessed)],
        tool: SECTIONS_TOOL, requiredKeys: ["sections"], maxTokens: 16000,
      });
      setSections(sectionsResult.sections);
      updateStep("sections", { status: "done" });

      updateStep("factcheck", { status: "running" });
      const fcp = factCheckPrompt(facts, product, sectionsResult.sections);
      const factCheck = await runStructuredStep({
        provider, apiKey, model, system: fcp.system, userContent: [{ type: "text", text: fcp.instructionText }],
        tool: FACTCHECK_TOOL, requiredKeys: FACTCHECK_TOOL.input_schema.required, maxTokens: 16000,
      });
      setSections(factCheck.correctedSections);
      setFactCheckIssues(factCheck.issues);
      updateStep("factcheck", { status: "done" });

      const finalResult = {
        id, createdAt, mode, productFacts: facts, benchmarkAnalysis: benchmark, productAnalysis: product,
        strategy: strategyResult, sections: factCheck.correctedSections, factCheckIssues: factCheck.issues,
      };
      setRecentResults(saveRecentResult(finalResult));
      setActiveTab("sections");
    } catch (e) {
      const msg = e.message || "알 수 없는 오류가 발생했습니다.";
      setSteps((prev) => prev.map((s) => (s.status === "running" ? { ...s, status: "error", errorMessage: msg } : s)));
      setPipelineError(msg);
    } finally {
      setIsRunning(false);
    }
  };

  const currentResult = useMemo(() => {
    if (!resultId || !resultCreatedAt) return null;
    return { id: resultId, createdAt: resultCreatedAt, mode, productFacts: facts, benchmarkAnalysis, productAnalysis, strategy, sections, factCheckIssues };
  }, [resultId, resultCreatedAt, mode, facts, benchmarkAnalysis, productAnalysis, strategy, sections, factCheckIssues]);

  const handleReset = () => {
    benchmarkImages.forEach((i) => URL.revokeObjectURL(i.previewUrl));
    productImages.forEach((i) => URL.revokeObjectURL(i.previewUrl));
    setBenchmarkImages([]);
    setProductImages([]);
    setFacts(EMPTY_FACTS);
    setSteps(initialSteps());
    setBenchmarkAnalysis(null);
    setProductAnalysis(null);
    setStrategy(null);
    setSections([]);
    setFactCheckIssues([]);
    setResultId(null);
    setResultCreatedAt(null);
    setPipelineError("");
    setActiveTab("benchmark");
  };

  const handleLoadRecent = (r) => {
    setMode(r.mode);
    setFacts(r.productFacts);
    setBenchmarkAnalysis(r.benchmarkAnalysis);
    setProductAnalysis(r.productAnalysis);
    setStrategy(r.strategy);
    setSections(r.sections);
    setFactCheckIssues(r.factCheckIssues);
    setResultId(r.id);
    setResultCreatedAt(r.createdAt);
    setSteps(initialSteps().map((s) => ({ ...s, status: "done" })));
    setActiveTab("sections");
    setNotice("저장된 텍스트 결과를 불러왔습니다. 이미지는 저장되지 않으므로 재분석하려면 다시 업로드해주세요.");
  };

  const handleDeleteRecent = (id) => setRecentResults(deleteRecentResult(id));

  const warningCount = (productAnalysis
    ? productAnalysis.inferredUnconfirmed.length + productAnalysis.conflictingInfo.length + productAnalysis.needsVerification.length + productAnalysis.forbiddenClaims.length
    : 0) + factCheckIssues.length;

  return (
    <div>
      <header className="app-header">
        <div className="container header-inner">
          <div>
            <h1 className="title">쿠팡 상세페이지 프롬프트 생성기 <span className="badge badge-navy">독립형</span></h1>
            <p className="subtitle">벤치마크와 내 제품 자료를 분석해 구성 · 한글 카피 · 이미지 생성 프롬프트를 만듭니다. 브라우저에서 Claude · Gemini · ChatGPT API를 직접 호출합니다.</p>
          </div>
          <div className="header-actions">
            <ModeToggle value={mode} onChange={setMode} disabled={isRunning} />
            <button type="button" className="btn" onClick={() => setSettingsOpen((v) => !v)}>⚙ API 키 설정</button>
          </div>
        </div>
      </header>

      {settingsOpen && <div className="container" style={{ paddingTop: 16 }}><SettingsPanel settings={settings} onSave={setSettings} onClose={() => setSettingsOpen(false)} /></div>}
      {notice && <div className="container" style={{ paddingTop: 16 }}><div className="card" style={{ background: "var(--navy-50)", fontSize: 13 }}>{notice}</div></div>}

      <main className="container layout">
        <div className="stack">
          <ImageUploader title="벤치마크 상세페이지 이미지" description="경쟁사 또는 참고용 상세페이지 이미지를 업로드하세요. 상단부터 순서대로 배치해주세요."
            roleBadgeLabel="벤치마크" roleBadgeClass="badge-navy" items={benchmarkImages} setItems={setBenchmarkImages} showSubRole={false} />
          <ImageUploader title="내 제품 이미지" description="정면, 측면, 포장, 구성품, 사용 장면 등 실제 제품 근거가 되는 이미지를 업로드하세요."
            roleBadgeLabel="실제 제품 근거 이미지" roleBadgeClass="badge-green" items={productImages} setItems={setProductImages} showSubRole={true} />
          <ProductFactsForm value={facts} onChange={setFacts} productImages={productImages} provider={provider} apiKey={apiKey} model={model} />

          <div className="card">
            <button type="button" className="btn btn-primary btn-block" onClick={handleAnalyze} disabled={!canAnalyze}>
              {isRunning ? "분석 진행 중…" : "분석 시작"}
            </button>
            {!canAnalyze && !isRunning && (
              <p className="hint" style={{ marginTop: 8 }}>
                {!apiKey ? "먼저 상단 'API 키 설정'에서 API 키를 저장해주세요." : "벤치마크 이미지 1장 이상, 제품 이미지 1장 이상, 제품명을 입력해야 분석을 시작할 수 있습니다."}
              </p>
            )}
            {pipelineError && <p className="hint" style={{ color: "#dc2626", whiteSpace: "pre-wrap", marginTop: 8 }}>{pipelineError}</p>}
          </div>

          <ProgressSteps steps={steps} />
          <RecentResults results={recentResults} onLoad={handleLoadRecent} onDelete={handleDeleteRecent} />
        </div>

        <div className="stack">
          <Toolbar result={currentResult} onReset={handleReset} />
          <div className="card" style={{ padding: 0 }}>
            <div className="tabs">
              {RESULT_TABS.map((t) => (
                <button key={t.key} type="button" className={"tab-btn" + (activeTab === t.key ? " active" : "")} onClick={() => setActiveTab(t.key)}>
                  {t.label}
                  {t.key === "warnings" && warningCount > 0 && <span className="badge badge-red">{warningCount}</span>}
                  {t.key === "sections" && sections.length > 0 && <span className="badge badge-navy">{sections.length}</span>}
                </button>
              ))}
            </div>
            <div className="tab-content">
              {activeTab === "benchmark" && <BenchmarkTab data={benchmarkAnalysis} />}
              {activeTab === "productFacts" && <ProductFactsTab facts={facts} analysis={productAnalysis} />}
              {activeTab === "strategy" && <StrategyTab data={strategy} />}
              {activeTab === "sections" && <SectionsTab sections={sections} onChangeSections={setSections} />}
              {activeTab === "warnings" && <WarningsTab productAnalysis={productAnalysis} factCheckIssues={factCheckIssues} />}
            </div>
          </div>
        </div>
      </main>

      <footer className="app-footer">
        이 파일은 서버 없이 브라우저에서 단독으로 동작하는 독립형 버전입니다. API 키는 이 브라우저의 localStorage에만 저장되고,
        분석 요청마다 선택한 AI 서비스(Claude · Gemini · ChatGPT)의 API로 직접 전송됩니다 (중간 서버 없음). 본인만 사용하는 개인 기기에서 사용하세요.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
