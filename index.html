<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORIVA</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./favicon.png">
<style>
  :root{
    --navy:#071A35; --navy-soft:#0E2A4C; --gold:#C9961A;
    --paper:#F4F6F7; --line:rgba(255,255,255,.10); --dim:rgba(255,255,255,.52);
    --rail:248px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    background:var(--paper); color:#1B2A3D; display:flex;
  }

  /* ── 좌측 고정 레일 ── */
  aside{
    width:var(--rail); flex:0 0 var(--rail);
    /* 모바일 브라우저의 100vh는 주소창을 뺀 실제 보이는 높이보다 커서
       사이드바 하단(동기화 설정)이 화면 밖으로 잘린다. dvh로 실제 높이를 쓴다. */
    height:100vh; height:100dvh;
    background:var(--navy); color:#fff; display:flex; flex-direction:column;
    overflow:hidden; z-index:40;
  }
  .brand{
    display:flex; align-items:center; gap:10px; padding:16px 16px 14px;
    text-decoration:none; color:#fff; flex-shrink:0; border-bottom:1px solid var(--line);
  }
  .brand-mark{
    width:36px; height:36px; flex-shrink:0;
    display:grid; place-items:center;
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .brand-text strong{display:block;font-size:14.5px;letter-spacing:.06em;line-height:1.2;}
  .brand-text small{display:block;color:var(--dim);font-size:10px;letter-spacing:.09em;margin-top:2px;}

  nav{flex:1; min-height:0; overflow-y:auto; padding:12px 10px 16px;}
  nav::-webkit-scrollbar{width:6px;}
  nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px;}
  .nav-group{margin-bottom:14px;}
  /* 맨 위 묶음(도구 모음 + 상품런칭 캘린더)은 아래 그룹과 선으로 구분 */
  .nav-group.nav-top{padding-bottom:12px;border-bottom:1px solid var(--line);}
  .nav-group > span{
    display:block; padding:6px 8px 7px; color:rgba(255,255,255,.34);
    font-size:10.5px; font-weight:800; letter-spacing:.12em;
  }
  nav a{
    display:flex; align-items:center; gap:9px; padding:9px 9px; border-radius:9px;
    color:rgba(255,255,255,.80); text-decoration:none; font-size:13px; font-weight:600;
    line-height:1.3; transition:background .12s,color .12s;
  }
  nav a:hover{background:rgba(255,255,255,.07); color:#fff;}
  nav a.active{background:var(--gold); color:var(--navy); font-weight:800;}
  nav a .ico{
    width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.09);
    display:grid;place-items:center;font-size:14px;flex-shrink:0;
  }
  nav a.active .ico{background:rgba(7,26,53,.16);}
  nav a .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  nav a .new{
    font-size:8.5px;font-weight:800;background:#B8453A;color:#fff;
    border-radius:20px;padding:2px 6px;letter-spacing:.04em;flex-shrink:0;
  }
  nav a.active .new{background:var(--navy);}
  .rail-foot{
    flex-shrink:0; border-top:1px solid var(--line);
    /* 아이폰 하단 홈 인디케이터에 버튼이 가리지 않도록 여백을 더한다 */
    padding:12px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    display:flex; flex-direction:column; gap:8px;
  }
  .rail-foot button{
    width:100%; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:9px; border:1px solid rgba(255,255,255,.16); border-radius:9px;
    background:transparent; color:rgba(255,255,255,.78); font:inherit; font-size:12px;
    font-weight:700; cursor:pointer;
  }
  .rail-foot button:hover{background:rgba(255,255,255,.08); color:#fff;}
  .rail-foot small{color:rgba(255,255,255,.32); font-size:10px; text-align:center; line-height:1.5;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.32);flex-shrink:0;}
  .sync-dot.ok{background:#4F9E7A;} .sync-dot.err{background:#D9615A;} .sync-dot.busy{background:var(--gold);}

  /* ── 우측 콘텐츠 ── */
  main{flex:1; min-width:0; height:100vh; height:100dvh; display:flex; flex-direction:column;}
  /* 도구 이름은 각 도구 페이지가 직접 보여주므로 PC에서는 상단 바를 두지 않는다.
     모바일에서는 사이드바가 숨겨지므로 메뉴·뒤로가기 버튼용으로만 표시한다. */
  .topbar{
    display:none; flex-shrink:0; height:48px; align-items:center; gap:8px;
    padding:0 12px; background:#fff; border-bottom:1px solid #E3E6EA;
  }
  .burger{display:none;background:none;border:0;font-size:19px;cursor:pointer;color:#1B2A3D;padding:4px 6px;}
  /* 모바일에서는 사이드바가 숨겨지므로 도구 모음으로 돌아가는 버튼을 상단에 둔다 */
  .backbtn{
    display:none;background:#F4F6F7;border:1px solid #E3E6EA;border-radius:8px;
    font-size:16px;line-height:1;cursor:pointer;color:#1B2A3D;padding:7px 10px;flex-shrink:0;
  }
  .backbtn:hover{border-color:var(--gold);}
  iframe{flex:1;width:100%;border:0;display:block;background:var(--paper);}

  .scrim{display:none;position:fixed;inset:0;background:rgba(7,26,53,.45);z-index:35;}

  /* ── 동기화 모달 ── */
  .ov{position:fixed;inset:0;z-index:60;background:rgba(7,26,53,.45);display:none;place-items:center;padding:18px;}
  .ov.show{display:grid;}
  .modal{width:min(400px,100%);max-height:88vh;overflow-y:auto;background:#fff;border-radius:16px;padding:22px;}
  .modal h2{margin:0 0 5px;font-size:16px;}
  .modal p.lead{margin:0 0 15px;font-size:12px;color:#8B95A1;line-height:1.65;}
  .fld{margin-bottom:12px;}
  .fld label{display:block;font-size:11.5px;font-weight:800;color:#8B95A1;margin-bottom:5px;}
  .fld input{width:100%;padding:9px 10px;border:1px solid #DCD5C3;border-radius:8px;font-size:14px;font-family:inherit;}
  #syncMsg{font-size:11.5px;color:#8B95A1;margin:4px 0 12px;line-height:1.55;}
  .sync-scope{background:#F6F3EC;border-radius:10px;padding:11px 13px;margin-bottom:15px;display:grid;gap:8px;}
  .sync-scope div{font-size:11.5px;line-height:1.6;}
  .sync-scope b{display:block;color:#1B2A3D;margin-bottom:2px;}
  .sync-scope span{color:#8B95A1;}
  .acts{display:flex;gap:8px;}
  .acts button{flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
  .acts .off{background:#fff;border:1px solid #DCD5C3;color:#8B95A1;}
  .acts .on{background:var(--navy);border:0;color:#fff;}

  @media (max-width:820px){
    /* 드로어는 top/bottom을 함께 고정해 실제 보이는 영역에 딱 맞춘다
       (height 계산에 의존하지 않으므로 주소창이 나타나고 사라져도 하단이 잘리지 않음) */
    aside{position:fixed;left:0;top:0;bottom:0;height:auto;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.3);}
    body.nav-open aside{transform:translateX(0);}
    body.nav-open .scrim{display:block;}
    .burger{display:block;}
    /* 도구를 보고 있을 때만 뒤로가기 표시 (도구 모음 화면에서는 숨김) */
    body.in-tool .backbtn{display:block;}
    .topbar{display:flex;}
  }
</style>
</head>
<body>

<aside id="rail">
  <a class="brand" href="#home">
    <span class="brand-mark"><img src="./moriva-mark-white.png" alt="MORIVA"></span>
    <span class="brand-text"><strong>MORIVA</strong><small>SELLER TOOLKIT</small></span>
  </a>
  <nav id="nav"></nav>
  <div class="rail-foot">
    <button type="button" id="syncBtn"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">동기화 설정</span></button>
    <small>데이터는 내 브라우저와<br>내 비공개 저장소에만 보관됩니다.</small>
  </div>
</aside>

<div class="scrim" id="scrim"></div>

<main>
  <div class="topbar">
    <button class="burger" id="burger" aria-label="메뉴 열기">☰</button>
    <button class="backbtn" id="backBtn" aria-label="전체 보기로">←</button>
  </div>
  <iframe id="frame" title="도구 화면"></iframe>
</main>

<div class="ov" id="syncOv">
  <div class="modal">
    <h2>☁ 브라우저 간 동기화</h2>
    <p class="lead">도구 데이터를 내 비공개 GitHub 저장소에 자동 백업합니다. 다른 브라우저·기기에서 같은 설정을 입력하면 동일한 데이터가 보여요.</p>
    <div class="sync-scope">
      <div><b>동기화됨</b><span>소싱 대시보드(상태·메모·숨김·직접 수정한 값), 소싱 가격비교, 상품런칭 캘린더, 화면 설정</span></div>
      <div><b>제외됨</b><span>AI API 키·토큰(보안), 소싱 후보(자체 서버로 이미 동기화 중), 스튜디오 작업 중 이미지(용량)</span></div>
    </div>
    <div class="fld"><label>Personal Access Token</label><input type="password" id="ghTok" placeholder="github_pat_... 또는 ghp_..."></div>
    <div class="fld"><label>GitHub 사용자명</label><input type="text" id="ghOwner" placeholder="GerrardLIM42"></div>
    <div class="fld"><label>데이터 저장소 (비공개 권장)</label><input type="text" id="ghRepo" placeholder="moriva-data"></div>
    <div class="fld"><label>브랜치</label><input type="text" id="ghBranch" placeholder="main"></div>
    <div id="syncMsg">연동 안 됨</div>
    <div class="acts"><button type="button" class="off" id="ghOff">연결 해제</button><button type="button" class="on" id="ghSave">저장하고 연결</button></div>
  </div>
</div>

<script src="./moriva-tools-list.js"></script>
<script>
"use strict";

/* ── 사이드바 렌더링 ── */
var nav = document.getElementById("nav");
// 맨 위: 그룹에 넣지 않고 따로 올린 도구(상품런칭 캘린더 등)
// 전체 보기로 돌아가는 건 상단 로고를 누르면 되므로 별도 '도구 모음' 항목은 두지 않는다.
var html = '<div class="nav-group nav-top">' +
  (window.MORIVA_PINNED || []).map(function (t) {
    return '<a href="#' + t.id + '" data-id="' + t.id + '">' +
      '<span class="ico">' + t.icon + '</span><span class="nm">' + t.name + "</span>" +
      (t.badge ? '<span class="new">' + t.badge + "</span>" : "") + "</a>";
  }).join("") +
  "</div>";
window.MORIVA_TOOLS.forEach(function (g) {
  html += '<div class="nav-group"><span>' + g.group + "</span>" +
    g.items.map(function (t) {
      return '<a href="#' + t.id + '" data-id="' + t.id + '">' +
        '<span class="ico">' + t.icon + '</span><span class="nm">' + t.name + "</span>" +
        (t.badge ? '<span class="new">' + t.badge + "</span>" : "") + "</a>";
    }).join("") + "</div>";
});
nav.innerHTML = html;

/* ── 라우팅 ──
   ASSET_VERSION: 도구 파일을 수정할 때마다 이 값을 올린다.
   모바일 브라우저는 HTML을 오래 캐시해 수정 사항이 바로 반영되지 않는데,
   주소에 버전을 붙이면 새 주소로 인식해 항상 최신 파일을 받아온다. */
var ASSET_VERSION = "20260729q";
var frame = document.getElementById("frame");
function route() {
  var id = (location.hash || "#home").slice(1);
  var tool = window.MORIVA_FIND_TOOL(id);
  var file = (id === "home" || !tool) ? "home.html" : id + ".html";
  var abs = new URL("./" + file + "?solo=1&v=" + ASSET_VERSION, location.href).href;
  if (frame.getAttribute("data-file") !== file) {
    frame.setAttribute("data-file", file);
    frame.src = abs;
  }
  // 도구 이름은 각 도구 페이지 안에서 표시하므로 상단 바에는 넣지 않는다.
  document.title = tool ? "MORIVA · " + tool.name : "MORIVA";
  nav.querySelectorAll("a").forEach(function (a) {
    a.classList.toggle("active", a.getAttribute("data-id") === id);
  });
  // 도구를 보고 있을 때만 모바일 뒤로가기 버튼을 띄운다
  document.body.classList.toggle("in-tool", Boolean(tool));
  document.body.classList.remove("nav-open");
}
window.addEventListener("hashchange", route);
route();

/* 사이드바 상단 로고를 누르면 언제나 도구 모음 화면으로 돌아온다.
   (이미 #home 상태라 hashchange가 일어나지 않는 경우에도 확실히 이동하도록 직접 처리) */
document.querySelector(".brand").addEventListener("click", function (e) {
  e.preventDefault();
  if (location.hash === "#home" || location.hash === "") route();
  else location.hash = "#home";
});

/* 홈 카드에서 프레임 내부 이동 요청 */
window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "moriva-go" && e.data.id) location.hash = "#" + e.data.id;
  // 소싱 후보가 저장을 알리면 현재 도구 프레임에도 전달해 즉시 반영되게 한다
  if (e.data && e.data.type === "moriva-manifest-updated") {
    try { frame.contentWindow.postMessage(e.data, "*"); } catch (err) {}
  }
});

/* 모바일 뒤로가기 → 도구 모음 */
document.getElementById("backBtn").addEventListener("click", function () {
  location.hash = "#home";
});

/* 모바일 드로어 */
document.getElementById("burger").addEventListener("click", function () { document.body.classList.add("nav-open"); });
document.getElementById("scrim").addEventListener("click", function () { document.body.classList.remove("nav-open"); });

/* ── 동기화 (상위 프레임에서만 동작) ── */
var CFG_KEY = "moriva_sync_config_v1";
var syncCfg = null;
try { syncCfg = JSON.parse(localStorage.getItem(CFG_KEY)); } catch (e) {}

function setSyncUi(text, kind) {
  document.getElementById("syncMsg").textContent = text;
  document.getElementById("syncLabel").textContent =
    kind === "ok" ? "동기화 켜짐" : kind === "err" ? "동기화 오류" : kind === "busy" ? "동기화 중…" : "동기화 설정";
  var dot = document.getElementById("syncDot");
  dot.className = "sync-dot" + (kind ? " " + kind : "");
}
window.MORIVA_SYNC_UI = setSyncUi;

var ov = document.getElementById("syncOv");
document.getElementById("syncBtn").addEventListener("click", function () {
  try { syncCfg = JSON.parse(localStorage.getItem(CFG_KEY)); } catch (e) {}
  document.getElementById("ghTok").value = syncCfg ? syncCfg.token : "";
  document.getElementById("ghOwner").value = syncCfg ? syncCfg.owner : "";
  document.getElementById("ghRepo").value = syncCfg ? syncCfg.repo : "moriva-data";
  document.getElementById("ghBranch").value = (syncCfg && syncCfg.branch) || "main";
  ov.classList.add("show");
});
ov.addEventListener("click", function (e) { if (e.target === ov) ov.classList.remove("show"); });
document.getElementById("ghSave").addEventListener("click", function () {
  var token = document.getElementById("ghTok").value.trim();
  var owner = document.getElementById("ghOwner").value.trim();
  var repo = document.getElementById("ghRepo").value.trim();
  var branch = document.getElementById("ghBranch").value.trim() || "main";
  if (!token || !owner || !repo) { alert("토큰, 사용자명, 저장소 이름을 모두 입력해주세요."); return; }
  ov.classList.remove("show");
  if (window.MORIVA_SYNC_CONNECT) window.MORIVA_SYNC_CONNECT({ token: token, owner: owner, repo: repo, branch: branch });
});
document.getElementById("ghOff").addEventListener("click", function () {
  if (!confirm("동기화를 해제할까요? 이 브라우저의 데이터는 그대로 유지돼요.")) return;
  ov.classList.remove("show");
  if (window.MORIVA_SYNC_DISCONNECT) window.MORIVA_SYNC_DISCONNECT();
});
</script>
<script src="./moriva-sync.js"></script>
</body>
</html>
